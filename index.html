<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Career: Series 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12;--panel:#11161e;--panel2:#171e29;--line:#232c3a;
  --text:#e7ecf2;--mute:#8a96a8;--amber:#ffb000;--amberD:#7a5500;
  --green:#22d37a;--red:#ff4d5e;--blue:#4da3ff;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'Archivo',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px,#1a2433 0%,transparent 70%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px 60px}

/* ticker */
.ticker{position:sticky;top:0;z-index:20;background:#000;border-bottom:1px solid var(--amberD);overflow:hidden;white-space:nowrap;height:30px;display:flex;align-items:center}
.ticker .track{display:inline-block;animation:scroll 140s linear infinite;font:500 12px/30px var(--mono);color:var(--amber)}
.ticker span{margin-right:34px}.ticker b{color:var(--green);font-weight:500}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 0 14px;gap:10px}
.brand{font:900 26px/1 var(--sans);letter-spacing:-.02em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--amber)}
.brand small{display:block;font:500 11px var(--mono);color:var(--mute);letter-spacing:.12em;margin-top:6px}
.iconbtn{font:500 11px var(--mono);color:var(--mute);border:1px solid var(--line);padding:6px 9px;border-radius:6px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.badge{display:flex;gap:14px;align-items:center}
.rankchip{width:54px;height:54px;border-radius:10px;background:linear-gradient(160deg,#2a1f00,#000);border:1px solid var(--amberD);display:grid;place-items:center;font:800 20px var(--mono);color:var(--amber);flex:none}
.lbl{font:500 10px var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.rankname{font:800 20px var(--sans);margin:2px 0}
.bar{height:6px;background:#000;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px;transition:width .5s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--panel2);border-radius:8px;padding:9px 10px}
.stat .v{font:700 16px var(--mono);margin-top:3px}
.pos{color:var(--green)}.neg{color:var(--red)}

.sect{font:800 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sect .lbl{letter-spacing:.06em}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;position:relative;overflow:hidden}
.mode:active{transform:scale(.98)}
.mode h3{font:800 16px var(--sans);margin:4px 0}
.mode p{font-size:12px;color:var(--mute);line-height:1.35}
.mode.boss{grid-column:1/-1;border-color:var(--amberD);background:linear-gradient(120deg,#1d1600,#11161e 60%)}
.mode.boss h3{font-size:20px;color:var(--amber)}
.mode .k{font:700 11px var(--mono);color:var(--amber)}
.mode .cnt{position:absolute;right:12px;top:12px;font:700 12px var(--mono);background:var(--red);color:#fff;border-radius:10px;padding:2px 8px}

.desk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.desk:active{transform:scale(.99)}
.desk .no{font:700 14px var(--mono);color:var(--amber);width:28px;flex:none}
.desk .t{flex:1;min-width:0}
.desk h4{font:700 15px var(--sans)}
.desk p{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .r{text-align:right;flex:none}
.stars{font-size:13px;letter-spacing:1px;color:var(--amber)}
.stars .off{color:#333c4a}
.desk.locked{opacity:.45}
.desk.locked .no{color:var(--mute)}
.mastery{font:500 10px var(--mono);color:var(--mute);margin-top:2px}

/* play */
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:14px 0 10px}
.quit{font:500 12px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.prog{height:6px;background:#000;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber);transition:width .3s}
.hudr{font:700 13px var(--mono)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:500 12px var(--mono)}
.chip b{font-weight:700}
.lives{letter-spacing:2px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.qmeta{font:500 11px var(--mono);color:var(--mute);letter-spacing:.08em;display:flex;justify-content:space-between;margin-bottom:10px}
.qtext{font:600 19px/1.35 var(--sans)}
.proposal{margin-top:14px;border-left:3px solid var(--amber);background:#1a1606;padding:10px 12px;border-radius:0 8px 8px 0;font:600 16px/1.35 var(--sans)}
.proposal .lbl{display:block;margin-bottom:4px;color:var(--amber)}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font:500 15px/1.35 var(--sans);transition:background .15s,border-color .15s}
.opt .key{font:700 12px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none;margin-top:1px}
.opt:not([disabled]):active{transform:scale(.99)}
.opt.sel{border-color:var(--amber)}
.opt.ok{background:#0c2a1b;border-color:var(--green)}
.opt.bad{background:#2c0e13;border-color:var(--red)}
.opt[disabled]{cursor:default}
.tfrow{grid-template-columns:1fr 1fr}
.tfrow .opt{justify-content:center;font:800 17px var(--sans)}
.fb{margin-top:12px;border-radius:12px;padding:14px;border:1px solid}
.fb.ok{background:#0b1f15;border-color:#145c37}.fb.bad{background:#230c10;border-color:#6b1a24}
.fb h5{font:800 15px var(--sans);display:flex;justify-content:space-between}
.fb p{font-size:14px;line-height:1.45;margin-top:6px;color:#cfd7e1}
.fb .delta{font:700 15px var(--mono)}
.next{display:block;width:100%;margin-top:12px;background:var(--amber);color:#000;font:800 16px var(--sans);border-radius:10px;padding:14px;letter-spacing:.02em}
.next.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;display:grid;place-items:center;opacity:0}
.flash.show{animation:flash .9s ease-out}
.flash div{font:900 40px var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:14px 22px;border:3px solid;border-radius:10px;transform:rotate(-6deg);background:rgba(0,0,0,.6)}
@keyframes flash{0%{opacity:0;transform:scale(1.3)}15%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font:800 28px var(--mono);pointer-events:none;z-index:40;animation:up 1s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}

/* results */
.big{font:900 54px/1 var(--mono);letter-spacing:-.03em}
.verdict{font:900 28px var(--sans);text-transform:uppercase;letter-spacing:.02em}
.res-head{text-align:center;padding:26px 16px}
.res-head .stars{font-size:30px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font:500 10px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
td.n{text-align:right;font-family:var(--mono)}
.miss{border-bottom:1px solid var(--line);padding:12px 0}
.miss q{display:block;font-weight:600;quotes:none;font-size:14px}
.miss .a{font-size:13px;color:var(--green);margin-top:4px}
.miss .y{font-size:13px;color:var(--red);margin-top:2px}
.miss .e{font-size:13px;color:var(--mute);margin-top:4px;line-height:1.4}
.row{display:flex;gap:10px}.row>*{flex:1}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .card{max-width:420px;width:100%;text-align:center;padding:26px 20px}
.modal h2{font:900 26px var(--sans);margin:8px 0;text-transform:uppercase}
.modal p{color:var(--mute);font-size:14px;line-height:1.45}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;text-align:left;width:100%}
.sw{width:42px;height:24px;border-radius:12px;background:#333c4a;position:relative;flex:none;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--amber)}.sw.on::after{left:21px}
.cs{margin-bottom:12px;scroll-margin-top:44px}
.cs h3{font:800 18px var(--sans);margin:4px 0 10px}
.cs p,.cs li{font-size:14px;line-height:1.5;color:#d3dae4}
.cs ul,.cs ol{padding-left:20px;margin:8px 0}.cs li{margin-bottom:6px}
.cs-hook{font:800 18px var(--sans);color:var(--amber);text-align:center;border:1px dashed var(--amberD);border-radius:8px;padding:10px;margin:10px 0}
.cs-note{font-size:13px!important;color:var(--mute)!important;margin-top:8px}
.cs-ex{background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:8px}
.cs-line{display:flex;justify-content:space-between;gap:6px;font:500 11px var(--mono);background:#000;border-radius:8px;padding:10px;margin:8px 0;flex-wrap:wrap}
.cs-pic{font:700 13px var(--mono);text-align:center;background:#000;border-radius:8px;padding:12px;line-height:2;color:var(--amber)}
.cs-mkt{color:var(--text)}
.cs-eq{font:700 16px/1.8 var(--mono);background:#000;border-radius:8px;padding:10px 14px;color:var(--amber);margin:8px 0}
.cs-t{margin:6px 0}.cs-t td,.cs-t th{font-size:13px;padding:7px 6px}
.cs-t td:last-child{font-family:var(--mono);text-align:right}
.mode.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.mode.wide .ic{font:800 22px var(--mono);color:var(--amber);border:1px solid var(--amberD);border-radius:8px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.cd{border-color:var(--amberD)}
.cdtop{display:flex;justify-content:space-between;align-items:flex-start}
.cdn{font:900 46px/1 var(--mono);color:var(--amber);letter-spacing:-.03em}
.streak{text-align:right}.streak .v{font:800 26px var(--mono);margin-top:2px;color:var(--mute)}.streak.on .v{color:var(--green)}
.ph{font-size:14px;line-height:1.45;margin-top:12px;color:#d3dae4}.ph .k{font:700 11px var(--mono);color:var(--amber);margin-right:4px}
.din{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px;font:500 13px var(--mono);color-scheme:dark}
.ladder{width:100%;display:block;margin-top:12px;border-radius:8px;border:1px solid var(--line)}
.ladder .tk{font:500 10px var(--mono);fill:#6b778a}.ladder .zl{font:700 10px var(--mono);letter-spacing:.1em}
.ladder .mk{font:700 11px var(--mono);fill:#000}.ladder .tg{font:700 13px var(--mono);fill:#4da3ff}
.ladder .pl{animation:drop .35s ease-out}@keyframes drop{from{opacity:0;transform:translateX(30px)}to{opacity:1}}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mgrid>div{display:grid;gap:8px}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 10px;font:600 14px var(--sans);min-height:56px;transition:.15s}
.mt.r{font-family:var(--mono);font-size:13px}
.mt.sel{border-color:var(--amber);background:#1d1600}.mt.done{opacity:.25;border-color:var(--green)}.mt.bad{border-color:var(--red);background:#2c0e13}
/* ===== polish pass ===== */
body{background:
  radial-gradient(900px 420px at 50% -160px,rgba(255,176,0,.10) 0%,transparent 70%),
  linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px) 0 0/100% 28px,
  var(--bg)}
#app>*{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:.03s}#app>*:nth-child(3){animation-delay:.06s}#app>*:nth-child(4){animation-delay:.09s}
#app>*:nth-child(5){animation-delay:.12s}#app>*:nth-child(6){animation-delay:.15s}#app>*:nth-child(n+7){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal.show .card{animation:pop .28s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.qtext{font:700 20px/1.38 var(--sans);letter-spacing:-.01em}
.qcard{box-shadow:0 10px 30px -18px #000}
.qcard.pulse{animation:gpulse .6s ease-out}
@keyframes gpulse{0%{box-shadow:0 0 0 0 rgba(34,211,122,.55)}100%{box-shadow:0 0 0 18px rgba(34,211,122,0)}}
.qcard.shake{animation:shake .42s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@media(hover:hover){.opt:not([disabled]):hover{border-color:#3a475a;background:#1b2330}}
.opt.ok{box-shadow:inset 3px 0 0 var(--green)}.opt.bad{box-shadow:inset 3px 0 0 var(--red)}
.fb{animation:rise .3s both}
.toast{position:fixed;top:40px;left:50%;z-index:70;transform:translateX(-50%);font:900 15px var(--sans);letter-spacing:.14em;text-transform:uppercase;
  padding:10px 18px;border-radius:999px;color:#fff;background:var(--red);box-shadow:0 8px 30px rgba(255,77,94,.45);animation:toast 1.6s ease both;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.tick-up{animation:tup .7s}.tick-dn{animation:tdn .7s}
@keyframes tup{0%{background:rgba(34,211,122,.35)}100%{background:transparent}}
@keyframes tdn{0%{background:rgba(255,77,94,.35)}100%{background:transparent}}
.chip b{border-radius:4px;padding:0 2px}

/* hero countdown */
.cd{background:linear-gradient(150deg,#1e1700 0%,#11161e 55%);position:relative;overflow:hidden}
.cd::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(rgba(255,176,0,.18),transparent 70%)}
.cdn{font-size:64px;text-shadow:0 0 28px rgba(255,176,0,.35)}
.cdbar{height:4px;background:#000;border-radius:2px;margin-top:12px;overflow:hidden}.cdbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amberD),var(--amber))}

/* rank strip */
.rstrip{display:flex;align-items:center;gap:12px;margin-top:10px}
.rstrip .rankchip{width:46px;height:46px;font-size:16px}
.rstrip .mid{flex:1;min-width:0}.rstrip .rankname{font-size:17px;margin:1px 0 0}
.rstrip .pl{text-align:right}.rstrip .pl .v{font:700 15px var(--mono);margin-top:3px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{display:flex;align-items:center;gap:11px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;transition:transform .12s,border-color .2s}
.tile:active{transform:scale(.97)}
.tile .ic{width:38px;height:38px;border-radius:9px;background:#000;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--amber)}
.tile .ic svg{width:20px;height:20px}
.tile h3{font:800 14px var(--sans)}.tile p{font:500 11px var(--mono);color:var(--mute);margin-top:2px}
.tile.boss{grid-column:1/-1;border-color:var(--amberD);background:linear-gradient(110deg,#251c00,#11161e 65%);padding:14px}
.tile.boss .ic{background:var(--amber);color:#000;border-color:var(--amber)}
.tile.boss h3{font-size:18px;color:var(--amber)}
.tile .cnt{position:absolute;right:8px;top:8px;font:700 11px var(--mono);background:var(--red);color:#fff;border-radius:10px;padding:1px 7px}

/* career track */
.track{margin-top:4px}
.stop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;position:relative;padding:6px 0}
.stop::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:#232c3a}
.stop.done::before{background:var(--amber)}
.stop:first-child::before{top:50%}.stop:last-child::before{bottom:50%}
.node{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px var(--mono);z-index:1;background:var(--bg);border:2px solid #2a3443;color:var(--mute)}
.stop.done .node{background:var(--amber);border-color:var(--amber);color:#000}
.stop.cur .node{border-color:var(--amber);color:var(--amber);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,176,0,.5)}50%{box-shadow:0 0 0 8px rgba(255,176,0,0)}}
.stop .box{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;transition:transform .12s}
.stop:active .box{transform:scale(.98)}
.stop.cur .box{border-color:var(--amberD);background:linear-gradient(110deg,#1d1600,var(--panel) 70%)}
.stop .box .t{flex:1;min-width:0}.stop h4{font:700 15px var(--sans)}
.stop p{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.stop .tag{display:inline-block;font:700 9px var(--mono);letter-spacing:.12em;color:#000;background:var(--amber);border-radius:4px;padding:2px 6px;margin-bottom:4px}
.stop.lock{opacity:.42}
.stop .r{text-align:right;flex:none}

/* shift chart */
.spark{width:100%;display:block}
.spark .ax{font:500 9px var(--mono);fill:#5d697c}
.spark .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark .dot{opacity:0;animation:fadein .3s forwards}
@keyframes fadein{to{opacity:1}}
.posbox{margin-top:12px;background:#000;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:500 14px/1.55 var(--mono);color:#e8d9b0}
.posbox .rnl{font-family:var(--sans);color:var(--text);font-size:15px;padding-left:4px}
.opt .key{text-transform:lowercase}
.stbadge{margin-top:12px;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;border:1px solid}
.stbadge b{font:800 13px var(--mono);letter-spacing:.08em}.stbadge span{font-size:13px;color:#d3dae4;line-height:1.4}
.st-ahead{background:#0b2216;border-color:#1c6b42}.st-ahead b{color:var(--green)}
.st-on{background:#1d1700;border-color:var(--amberD)}.st-on b{color:var(--amber)}
.st-more{background:#250d12;border-color:#7a2230}.st-more b{color:var(--red)}
.foot{font:500 10px var(--mono);color:#4b5668;text-align:center;margin-top:30px;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="ticker"><div class="track" id="ticker"></div></div>
<div class="wrap" id="app"></div>
<div class="flash" id="flash"><div></div></div>
<div class="modal" id="modal"><div class="card" id="modalc"></div></div>

<script>
const Q=[];
Q.push(
{c:1,q:"Who holds trading privileges on the floor of a futures exchange?",o:["Only exchange members (FCMs)","Any registered AP","Introducing Brokers","Commodity Pool Operators"],a:0,e:"Only exchange members, i.e. FCMs, have trading privileges on the exchange floor."},
{c:1,q:"A floor trader who trades for their own account is commonly called a\u2026",o:["Local","Runner","Commission house","Correspondent"],a:0,e:"Floor traders trade for their own accounts and are called 'locals'."},
{c:1,q:"Which floor trader holds positions for only a few minutes and provides liquidity by buying the bid and selling the ask?",o:["Scalper","Position trader","Day trader","Spreader"],a:0,e:"Scalpers hold for minutes, standing ready to buy at the bid and sell at the ask \u2014 they provide liquidity."},
{c:1,q:"Which floor trader holds positions the LONGEST?",o:["Position trader","Day trader","Scalper","Floor broker"],a:0,e:"Position traders hold the longest \u2014 usually days or weeks."},
{c:1,q:"What is a 'tick'?",o:["The minimum price change for a contract, set by the exchange","The daily price limit","One full contract","The difference between bid and ask"],a:0,e:"A tick is the minimum price change for a particular contract; it varies by contract and is set by the exchange."},
{c:1,q:"The settlement price is best described as\u2026",o:["The last trade of the day","The closing range","The average of the day's trades","The opening price"],a:0,e:"Per the book, the settlement price is the last trade of the day. The closing range is NOT the settlement price."},
{c:1,q:"CME Globex was formed by the merger of which exchanges?",o:["CME, CBOT and NYMEX (incl. COMEX)","CME, ICE and LME","CBOT, CBOE and NYSE","NYMEX, ICE and Eurex"],a:0,e:"CME Globex came from the merger of the Chicago Mercantile Exchange, Chicago Board of Trade and NYMEX (which included COMEX)."},
{c:1,q:"What does the IMM (International Monetary Market) trade?",o:["Currency and interest rate futures","Grain futures","Energy futures","Metals only"],a:0,e:"The IMM, part of CME Group, trades currency and interest rate futures."},
{c:1,q:"On electronic platforms, queued orders are executed\u2026",o:["By price on a FIFO basis","At random","By order size","By customer seniority"],a:0,e:"Matched orders execute immediately; queued orders execute by price on a First-In, First-Out basis."},
{c:1,q:"A broker takes the opposite side of a customer order into their own account without open, competitive execution. This is\u2026",o:["Bucketing (trading against) \u2014 a violation","Scalping \u2014 permitted","A block trade \u2014 permitted","Give-up \u2014 permitted"],a:0,e:"Bucketing (also called trading against) is a violation of NFA/CFTC rules."},
{c:1,q:"Who acts as the counterparty on all futures trades?",o:["The clearinghouse","The exchange's board","The FCM","The NFA"],a:0,e:"Clearinghouses guarantee futures trades and are the counterparty on all trades."},
{c:1,q:"Which of these is NOT a clearinghouse function?",o:["Setting the market price of the contract","Collecting clearing margin from members","Overseeing delivery procedures","Reporting volume and open interest"],a:0,e:"Prices are set by supply and demand. Clearinghouses match trades, collect margin, monitor risk, oversee delivery and report volume/OI."},
{c:1,q:"A clearing member acting for correspondent firms must know\u2026",o:["The margin positions of the correspondent firms, not their customers","Every customer's margin position","Nothing about margin","Only the customers' names"],a:0,e:"A clearing member must know the exact margin positions of correspondent firms, but not those of the correspondents' customers."},
{c:1,q:"Minimum adjusted net capital required for an FCM?",o:["$1,000,000","$45,000","$500,000","$100,000"],a:0,e:"Each FCM must maintain adjusted net capital of $1,000,000 or greater."},
{c:1,q:"Minimum adjusted net capital for an INDEPENDENT Introducing Broker?",o:["$45,000","$1,000,000","$25,000","No minimum requirement"],a:0,e:"An independent IB must maintain adjusted net capital of at least $45,000."},
{c:1,q:"An undercapitalised IB must give immediate notice to\u2026",o:["The NFA","The CFTC and NFA","The SEC","Its customers only"],a:0,e:"FCM: notify CFTC and NFA. IB: notify the NFA."},
{c:1,q:"An undercapitalised FCM must give immediate notice to\u2026",o:["The CFTC and the NFA","The NFA only","The exchange only","The SEC"],a:0,e:"An undercapitalised FCM must notify both the CFTC and the NFA."},
{c:1,q:"An independent IB has a capital deficiency. What must it do?",o:["Cease operations until it's remedied","Carry on but notify customers","Borrow from its FCM","Nothing for 30 days"],a:0,e:"In the event of a deficiency, an independent IB must cease operations until the deficiency is remedied."},
{c:1,q:"What is true of a GUARANTEED IB?",o:["It has no minimum capital or financial reporting requirements","It needs $45,000 net capital","It may have several guarantee agreements","It can hold customer funds"],a:0,e:"A guaranteed IB has no minimum capital or financial reporting requirements; the FCM is fully responsible for it."},
{c:1,q:"How many guarantee agreements may an IB have at one time?",o:["1","2","3","Unlimited"],a:0,e:"An IB may not enter into more than one guarantee agreement at a time."},
{c:1,q:"A customer of an IB writes a cheque. It should be payable to\u2026",o:["The FCM (if authorised by the FCM)","The IB","The AP personally","The clearinghouse"],a:0,e:"IBs may accept cheques payable to the FCM only \u2014 never in their own name."},
{c:1,q:"How must an IB carry its customer accounts with an FCM?",o:["Fully disclosed","Omnibus","Anonymously","Through a CPO"],a:0,e:"An IB must carry all accounts through an FCM on a fully disclosed basis."},
{c:1,q:"An omnibus account is one where\u2026",o:["A clearing FCM carries a non-clearing FCM's account without customer names","An IB discloses every customer","A CPO pools customer funds","A CTA manages several accounts"],a:0,e:"Omnibus: the clearing FCM carries a correspondent (non-clearing) FCM's account; customer names aren't disclosed."},
{c:1,q:"How long must IB books and records be kept?",o:["5 years, first 2 readily accessible","3 years","7 years, first 3 accessible","2 years"],a:0,e:"IB books and records: 5 years, the first 2 in a readily accessible location."},
{c:1,q:"How often must FCMs and independent IBs file unaudited Form 1-FR?",o:["Semiannually","Monthly","Quarterly","Annually"],a:0,e:"NFA rules require unaudited financial statements on Form 1-FR semiannually."},
{c:1,q:"Enhanced supervisory requirements apply when a firm charges 50%+ of active customers round-turn fees totalling at least\u2026",o:["$100 per contract","$50 per contract","$25 per contract","$200 per contract"],a:0,e:"50% or more of active customers paying round-turn charges of $100+ per contract triggers enhanced supervision."},
{c:1,q:"A broker charges $2 per side. What's the round-turn commission?",o:["$4","$2","$1","$8"],a:0,e:"Round-turn = entering and exiting, so $2 \u00d7 2 = $4."},
{c:1,q:"An AP wants to be associated with two NFA firms. What's required?",o:["Second firm files Form 3-R and both firms accept joint and several supervisory responsibility","It's prohibited","Only CFTC approval","Customer consent"],a:0,e:"Allowed if the second sponsor files Form 3-R and both certify they're jointly and severally responsible for supervising the AP."},
{c:1,q:"Associated Persons are also known as\u2026",o:["Registered Commodity Representatives (RCRs)","Floor brokers","Locals","Principals"],a:0,e:"APs are also known as Registered Commodity Representatives."},
{c:1,q:"An AP works for a firm that is exempt from registration. Must the AP register?",o:["Yes","No","Only if trading over $1m","Only if handling funds"],a:0,e:"Even when the employer is exempt, an AP trading commodity futures must be registered."},
{c:1,q:"A CPO's certified annual report must be distributed within how many days after fiscal year-end?",o:["90 calendar days","30 days","60 days","120 days"],a:0,e:"The annual report must be filed with the CFTC and distributed within 90 calendar days of fiscal year-end."},
{c:1,q:"A CPO may not use a Disclosure Document more than ___ after its date.",o:["12 months","6 months","9 months","24 months"],a:0,e:"A CPO may not use a Disclosure Document more than 12 months after the date of the document."},
{c:1,q:"Performance data in a Disclosure Document may not be more than ___ old.",o:["3 months","1 month","6 months","12 months"],a:0,e:"Performance data may not be more than 3 months older than the date of the Disclosure Document."},
{c:1,q:"What must be the ONLY material on the first page of a Disclosure Document?",o:["The Risk Disclosure Statement","The fee table","The performance record","The CTA's biography"],a:0,e:"The Risk Disclosure Statement must be the only material on the first page, with verbatim required language."},
{c:1,q:"How many years of business background for principals must the Disclosure Document cover?",o:["5 years","3 years","10 years","1 year"],a:0,e:"Business background of the pool operator, trading advisor and principals for the preceding 5 years; gaps must be explained."},
{c:1,q:"The pool's 'breakeven point' is\u2026",o:["The trading profit needed in year 1 to cover all fees and expenses","The price at which the pool closes","The minimum to start trading","The incentive fee hurdle"],a:0,e:"Breakeven is the first-year trading profit needed to equal all fees and expenses so participants recoup their investment."},
{c:1,q:"When preparing a breakeven analysis, which fee is EXCLUDED from the table?",o:["Incentive fees","Management fees","Brokerage commissions","Upfront charges"],a:0,e:"All fees and expenses are shown in a table EXCEPT incentive fees; interest income is then subtracted."},
{c:1,q:"Pools with net assets over what amount must send MONTHLY statements?",o:["$500,000","$400,000","$1,000,000","$100,000"],a:0,e:"All pools with net assets over $500,000 must distribute monthly account statements."},
{c:1,q:"A CPO is exempt from registration if total contributions don't exceed ___ and participants are ___ or fewer.",o:["$400,000; 15","$500,000; 15","$400,000; 25","$1,000,000; 10"],a:0,e:"Contributions \u2264 $400,000 and 15 or fewer participants \u2192 CPO exempt from registration."},
{c:1,q:"A CPO's pool can't meet margin calls. Notice must be given by\u2026",o:["5:00 p.m. CT the next business day","Immediately by phone","Within 5 business days","End of the month"],a:0,e:"CPO notice filings are due no later than 5:00 p.m. (CT) of the next business day."},
{c:1,q:"Funds sent to a commodity pool must be received in whose name?",o:["The pool's","The CPO's","The CTA's","The FCM's AP"],a:0,e:"Funds must be received in the pool's name, never the pool operator's or advisor's name. No commingling."},
{c:1,q:"A CPO that also acts as a CTA must\u2026",o:["Register separately as a CTA","Do nothing extra","Register as an FCM","Get SEC approval"],a:0,e:"CPOs also acting as CTAs must register separately as CTAs."},
{c:1,q:"Can a CTA accept or handle customer funds?",o:["Only if also registered as an FCM","Yes, always","Yes, if under $45,000","Only with NFA approval"],a:0,e:"A CTA may not accept or handle customer funds unless it is also registered as an FCM."},
{c:1,q:"A CTA is exempt from registration if in the preceding 12 months it advised no more than ___ people and doesn't hold itself out as a CTA.",o:["15","10","25","50"],a:0,e:"CTA exemption: advised 15 or fewer people in the past 12 months and doesn't hold itself out to the public."},
{c:1,q:"A CTA collects management fees directly from a client. How must this be shown?",o:["As a footnote to the performance record","On the risk disclosure page","It needn't be shown","In the annual report only"],a:0,e:"Fees collected directly must be footnoted on the CTA's performance record."},
{c:1,q:"Trading a client's account mainly to generate commissions is called\u2026",o:["Churning","Bucketing","Scalping","Front running"],a:0,e:"Churning: excessive trading primarily to generate commissions rather than benefit the client."},
{c:1,q:"Commodity pools are usually structured as\u2026",o:["Limited partnerships","Mutual funds","ETFs","Sole proprietorships"],a:0,e:"Pools are usually LPs (also corporations or LLCs). They're NOT the same as ETFs or mutual funds investing in futures."}
);
Q.push(
{c:2,q:"Which Act established the regulatory framework for US exchange futures trading?",o:["Commodity Exchange Act of 1936","Securities Act of 1933","Dodd-Frank Act of 2010","Bank Secrecy Act"],a:0,e:"The Commodity Exchange Act of 1936 set up the framework; objectives include integrity and financial responsibility of participants."},
{c:2,q:"The CFTC was established in\u2026",o:["1974","1936","1982","1922"],a:0,e:"The CFTC is a federal agency established in 1974 to administer the CEA."},
{c:2,q:"The NFA was established in\u2026",o:["1982","1974","1936","1999"],a:0,e:"The NFA, the industry-wide SRO, was established in 1982."},
{c:2,q:"A CFTC Commissioner trades commodity futures. This is\u2026",o:["A felony","Allowed with disclosure","A minor infraction","Allowed after 12 months' service"],a:0,e:"It's a felony for a CFTC Commissioner or employee to trade futures or options on futures."},
{c:2,q:"Which of these is NOT a CFTC concern?",o:["Licensing commodity exports","Designating contract markets","Limiting maximum positions","Preventing manipulation"],a:0,e:"The CFTC designates contract markets and limits positions but is not concerned with licensing commodity exports."},
{c:2,q:"CFTC registrants must keep books and records for\u2026",o:["5 years","3 years","2 years","7 years"],a:0,e:"CFTC registrants keep books and records for 5 years."},
{c:2,q:"Can the CFTC seek a restraining order without the US Attorney General?",o:["Yes, it can go directly to court","No, it must go through the AG","Only via the NFA","Only for criminal matters"],a:0,e:"The CFTC may go directly into court for a restraining order, independent of the Attorney General's Office."},
{c:2,q:"The Risk Disclosure Document must warn customers that a spread position\u2026",o:["May not be less risky than a simple long or short","Is always less risky","Has no margin","Is guaranteed by the clearinghouse"],a:0,e:"The RDD must state a spread position may not be less risky than a simple long or short position."},
{c:2,q:"The Options Risk Disclosure Statement says commodity options are\u2026",o:["Not suitable for many members of the public","Suitable for all investors","Risk free for buyers","Only for hedgers"],a:0,e:"It informs customers that commodity option transactions are not suitable for many members of the public."},
{c:2,q:"Who shares jurisdiction with the CFTC over security futures (single stock / narrow index)?",o:["SEC","NFA","FINRA","Federal Reserve"],a:0,e:"The SEC has concurrent jurisdiction with the CFTC over security futures."},
{c:2,q:"Which is NOT a requirement for CFTC 'contract market' designation?",o:["Agricultural futures must be traded","Procedures to prevent manipulation","Sufficient cash sales to reflect values","Trading not contrary to the public interest"],a:0,e:"There's no requirement that agricultural futures be traded."},
{c:2,q:"Minimum age for individual NFA membership?",o:["21","18","25","No minimum"],a:0,e:"An individual must be at least 21 and of good character, reputation and financial responsibility."},
{c:2,q:"Can the NFA Compliance Director subpoena documents without court approval?",o:["Yes","No, needs a court","Only with CFTC sign-off","Only for FCMs"],a:0,e:"The Compliance Director can compel testimony, subpoena documents and require sworn statements without court or regulatory approval."},
{c:2,q:"After an NFA complaint, the respondent must answer within\u2026",o:["30 days","10 days","45 days","90 days"],a:0,e:"30 days. Failure to answer is treated as admitting the facts and waiving a hearing."},
{c:2,q:"An NFA hearing is conducted by\u2026",o:["A 3-person Hearing Committee panel","A single arbitrator","The CFTC","The Board of Directors"],a:0,e:"Hearings are held by a 3-person panel of the Hearing Committee; decisions can go to the Appeals Committee."},
{c:2,q:"Can a decision of the NFA Appeals Committee be appealed?",o:["No \u2014 final and binding","Yes, to the CFTC","Yes, to federal court","Yes, once"],a:0,e:"Appeals Committee decisions are final and binding with no right of appeal."},
{c:2,q:"NFA arbitration claims must be filed within ___ of when the complainant knew or should have known.",o:["2 years","1 year","3 years","5 years"],a:0,e:"No claim may go to arbitration unless filed within 2 years."},
{c:2,q:"Claim of $40,000. How many arbitrators?",o:["1","3","5","2"],a:0,e:"Up to $150,000 the NFA appoints 1 arbitrator (3 possible on request if over $50k)."},
{c:2,q:"Claim of $200,000. How many arbitrators?",o:["3","1","2","5"],a:0,e:"Claims over $150,000 get 3 arbitrators."},
{c:2,q:"A $100,000 claim can get 3 arbitrators if a party requests in writing within ___ after the last pleading is due.",o:["30 days","10 days","60 days","90 days"],a:0,e:"For $50k\u2013$150k claims, 3 arbitrators if a party requests within 30 days after the last pleading, or the sole arbitrator asks."},
{c:2,q:"An NFA member fails to pay an arbitration award on time. What happens?",o:["Automatically suspended and barred until paid","A warning letter","A $500 fine","Nothing until a hearing"],a:0,e:"Failure to pay awards timely = automatic suspension and bar from the futures business until paid."},
{c:2,q:"Can an NFA member resign while under NFA investigation?",o:["No","Yes","Only with CFTC consent","Only if it pays a fine"],a:0,e:"An NFA member cannot resign while under investigation; the NFA or CFTC may deny a withdrawal of registration."},
{c:2,q:"Maximum NFA fine per violation?",o:["$500,000","$100,000","$1,000,000","$250,000"],a:0,e:"Fines up to $500,000 per violation, payable to the NFA Treasurer within 30 days."},
{c:2,q:"In settling a dispute, can an NFA member require a customer to agree not to talk to regulators?",o:["No","Yes, in writing","Yes, if paid","Only for small claims"],a:0,e:"A member may NOT require a release saying the customer won't give information to regulators."},
{c:2,q:"How often must FCMs audit their branch offices?",o:["Annually","Every 2 years","Quarterly","Monthly"],a:0,e:"FCMs must audit branch offices annually; records kept 5 years (2 readily accessible)."},
{c:2,q:"A Member Responsibility Action (MRA) is\u2026",o:["A summary action without prior hearing when immediate action is needed","A routine annual review","An arbitration award","A customer complaint"],a:0,e:"An MRA is a summary action (no prior hearing) taken when immediate action is required."},
{c:2,q:"When would the Business Conduct Committee impose trading restrictions?",o:["Only in an emergency","During any routine investigation","After every complaint","Never"],a:0,e:"Trading restrictions only in an emergency \u2014 not during routine investigations."},
{c:2,q:"Which NFA rule covers communications with the public and promotional material?",o:["Rule 2-29","Rule 2-30","Rule 2-38","Rule 2-36"],a:0,e:"Compliance Rule 2-29 covers promotional material. (2-30 is KYC, 2-38 is business continuity.)"},
{c:2,q:"Promotional material must be approved in writing by a supervisor\u2026",o:["Before first use","Within 10 days of use","Annually","Only if it shows performance"],a:0,e:"Advertising and promotional material must be reviewed and approved in writing by a supervisory employee prior to first use."},
{c:2,q:"Copies of promotional material must be kept for\u2026",o:["5 years from date of last use","3 years from first use","2 years","1 year"],a:0,e:"Copies plus approvers' names kept 5 years from the date of last use."},
{c:2,q:"Which counts as promotional material?",o:["All three: scripts, hotlines and pool newsletters","Only a cold-calling script","Only a hotline","Only monthly newsletters to pool participants"],a:0,e:"Sales scripts, cold calls, hotlines, internet materials, seminars and newsletters (including to pool participants) all count."},
{c:2,q:"A member with under 12 months of actual results shows hypothetical results. Where must the disclaimer go?",o:["Immediately preceding the hypothetical results","Immediately after","In the footer","Anywhere on the page"],a:0,e:"With under 12 months actual results, the disclaimer must immediately precede the hypothetical results; otherwise it may follow."},
{c:2,q:"A radio/TV ad making specific trade recommendations must be submitted to the NFA at least ___ before use.",o:["10 days","5 days","30 days","48 hours"],a:0,e:"Pre-approval by the NFA at least 10 days prior to use."},
{c:2,q:"A member reprints a magazine article as promotional material. Who is responsible for its content?",o:["The NFA member using it","The magazine","The author","No one"],a:0,e:"The member using a reprint becomes responsible for its content and compliance."},
{c:2,q:"Voluntary NFA review of promotional material gives the member\u2026",o:["No safe harbor","A full safe harbor","Immunity from fines","Automatic approval"],a:0,e:"Voluntary filing doesn't insulate the member \u2014 there's no 'safe harbor' for misstatements."},
{c:2,q:"Which is NOT a minimum AML programme requirement?",o:["Annual CFTC exam of every customer","A designated compliance officer","Ongoing training","An independent audit"],a:0,e:"AML minimums: policies/controls, compliance officer, ongoing training, independent audit, risk-based customer due diligence."},
{c:2,q:"Which NFA rule requires a business continuity and disaster recovery plan?",o:["Rule 2-38","Rule 2-29","Rule 2-30","Rule 2-9"],a:0,e:"NFA Rule 2-38: written business continuity and disaster recovery plan."},
{c:2,q:"An IB with more than one principal must give the NFA how many emergency contacts?",o:["2","1","3","None required"],a:0,e:"IB/CPO/CTA members with more than one principal must provide a second emergency contact."},
{c:2,q:"A cybersecurity incident must be reported to the NFA if it causes\u2026",o:["Loss of customer funds, loss of the member's capital, or notice to customers","Any phishing email","Any system slowdown","Only losses above $1m"],a:0,e:"Promptly notify NFA of incidents causing loss of customer/counterparty funds, own capital, or requiring notice to customers."},
{c:2,q:"Price limits are measured from\u2026",o:["The previous day's settlement price","Today's open","The contract's launch price","The weekly average"],a:0,e:"Price limits are the max daily move up/down from the previous day's settlement price."},
{c:2,q:"When a market hits its daily price limit\u2026",o:["Trading may continue, but only at or within the limit","Trading stops for the day","The exchange resets the price","All orders are cancelled"],a:0,e:"Limits freeze prices, not trading. Trading continues at or within the limit (locked limit)."},
{c:2,q:"On CBOT, after a contract settles limit bid/offered for 3 consecutive days, the limit becomes\u2026",o:["150% of its former limit","200%","Unlimited","Unchanged"],a:0,e:"After 3 consecutive limit days the limit auto-increases to 150%; minimum margin also rises by 150%."},
{c:2,q:"Changes to price limits require approval from\u2026",o:["The CFTC","The NFA","The clearinghouse","Nobody"],a:0,e:"Changes to price limits require CFTC approval."},
{c:2,q:"Do price limits guarantee you can offset a position that day?",o:["No","Yes","Only for hedgers","Only on CME"],a:0,e:"Price limits don't guarantee the ability to offset within that day's range."},
{c:2,q:"Who is exempt from position limits?",o:["Bona fide hedgers","Spreaders","Day traders","Floor traders"],a:0,e:"Bona fide hedgers are exempt. Spread positions ARE subject to limits."},
{c:2,q:"Are spread positions subject to position limits?",o:["Yes","No","Only intermarket","Only in grains"],a:0,e:"Spread positions are subject to the position limits."},
{c:2,q:"Position limits exist mainly to\u2026",o:["Prevent cornering the market","Reduce commissions","Protect FCM capital","Increase liquidity"],a:0,e:"Position limits prevent any trader from cornering the market and guard against concentrated positions."},
{c:2,q:"Once reportable levels are reached, who must file daily reports with the CFTC?",o:["Everyone, including hedgers","Speculators only","FCMs only","Only pools"],a:0,e:"Everyone, including hedgers, must file daily reports when the levels are reached."},
{c:2,q:"A 'call market' opens trading\u2026",o:["Each delivery month in turn, nearby to most deferred","All months at once","Deferred month first","Only the spot month"],a:0,e:"A designated person calls each delivery month successively from nearby to most deferred."},
{c:2,q:"Exchange arbitration is ___ for members and ___ for customers.",o:["Mandatory; voluntary","Voluntary; mandatory","Mandatory; mandatory","Voluntary; voluntary"],a:0,e:"Submitting to arbitration is mandatory for members and voluntary for customers."},
{c:2,q:"Re-tendering means\u2026",o:["Selling a futures contract after receiving a delivery notice and returning the notice","Rolling to the next month","Re-opening a closed account","Resubmitting a margin call"],a:0,e:"A long who gets a delivery notice sells a futures contract and returns the notice to be reissued to another long."},
{c:2,q:"For futures to be fungible, they must\u2026",o:["Have identical terms, including where they are cleared","Trade on the same exchange only","Have the same price","Be cash settled"],a:0,e:"Fungible = interchangeable; all terms must be identical, including the clearing location."},
{c:2,q:"Exchanges are\u2026",o:["Registered self-regulatory organisations","Federal agencies","Arms of the NFA","Private clubs with no rules"],a:0,e:"Exchanges are registered SROs, each with its own trading and disciplinary rules."}
);
Q.push(
{c:3,q:"Technical analysis forecasts prices using\u2026",o:["Charts, moving averages, trendlines, volume and open interest","Crop reports and weather","Government policy","Interest rate differentials only"],a:0,e:"Technical analysis uses price charts, moving averages, trendlines, volume and open interest. Supply/demand factors = fundamental analysis."},
{c:3,q:"A head and shoulders TOP formation is\u2026",o:["Bearish","Bullish","Neutral","A continuation signal"],a:0,e:"Head and shoulders top = bearish (reversal of an up move). Inverted/bottom = bullish."},
{c:3,q:"An inverted head and shoulders (bottom) is\u2026",o:["Bullish","Bearish","Neutral","A sign of a thin market"],a:0,e:"The inverted (bottom) formation is bullish \u2014 a reversal of a downward move."},
{c:3,q:"A double top looks like the letter ___ and is ___.",o:["M; bearish","W; bullish","M; bullish","W; bearish"],a:0,e:"Double top = M = bearish. Double bottom = W = bullish."},
{c:3,q:"An ascending triangle indicates\u2026",o:["A breakout to the upside","A breakout to the downside","No change","A gap"],a:0,e:"Ascending triangle \u2192 upside breakout; descending triangle \u2192 downside breakout."},
{c:3,q:"A price 'floor' where a contract has bottomed in the past is called\u2026",o:["Support","Resistance","A gap","Congestion"],a:0,e:"Support is a floor where demand increases and prices tend to stop falling."},
{c:3,q:"A price 'ceiling' where supply exceeds demand is called\u2026",o:["Resistance","Support","A flag","A pennant"],a:0,e:"Resistance is where the contract topped out before \u2014 a barrier to further advances."},
{c:3,q:"Today's session opens above yesterday's highest price, with no trades in between. This is a\u2026",o:["Gap","Pennant","Congestion area","Double top"],a:0,e:"A gap is a jump or drop in price where no trading has occurred."},
{c:3,q:"On a point and figure chart, Xs represent ___ and Os represent ___.",o:["Upward moves; downward moves","Downward moves; upward moves","Volume; open interest","Highs; lows"],a:0,e:"Columns of Xs are upward moves, Os are downward moves."},
{c:3,q:"A horizontal band of prices in a narrow range on a point and figure chart is a\u2026",o:["Congestion area","Gap","Flag","Resistance breakout"],a:0,e:"A congestion area is a narrow horizontal band of prices."},
{c:3,q:"A sharp rise followed by prices CONVERGING forms a\u2026",o:["Pennant","Flag","Double bottom","Gap"],a:0,e:"Pennant = sharp move then converging prices. Flag = sharp move then a narrow range."},
{c:3,q:"In a bullish flag pattern you'd expect\u2026",o:["Another flagpole move up","A reversal down","Sideways trading forever","A gap down"],a:0,e:"Bullish flags and pennants both suggest another flagpole move up."},
{c:3,q:"What are yield curves used to monitor?",o:["Interest rate movements","Grain supply","Open interest","Volume"],a:0,e:"Yield curves are used to monitor interest rate movements."},
{c:3,q:"Using unrealised profits as margin to add to a position in decreasing increments is\u2026",o:["Pyramiding","Churning","Scalping","Spreading"],a:0,e:"Pyramiding: unrealised profits used as margin to add, in decreasing increments, to the position."},
{c:3,q:"'Overbought' means the price has\u2026",o:["Risen too steeply and too fast relative to fundamentals","Fallen too fast","Hit its limit up","Too much volume"],a:0,e:"Overbought = risen too steeply/fast versus fundamentals. Oversold = declined too steeply/fast."},
{c:3,q:"'Selling pressure' means\u2026",o:["Supply (sellers) exceeds demand (buyers)","Demand exceeds supply","Prices are limit up","Open interest is rising"],a:0,e:"Selling pressure: supply of the contract exceeds demand."},
{c:3,q:"A key feature of a liquidating market is\u2026",o:["Longs selling and shorts buying to cover","New buyers entering","Rising open interest","Limit moves"],a:0,e:"A liquidating market sees heavy offsetting: longs selling holdings and shorts buying to cover."},
{c:3,q:"Open interest is\u2026",o:["The total longs (or total shorts) not yet offset or delivered","Total longs plus total shorts","Daily volume","Contracts delivered"],a:0,e:"Open interest = sum of all longs OR all shorts in one month, one market, not yet liquidated. Also called open commitments."},
{c:3,q:"Rising open interest + falling prices indicates\u2026",o:["New short selling","New buying","Short covering","Long liquidation"],a:0,e:"Increasing OI with falling prices = new short selling. With rising prices = new buying."},
{c:3,q:"Rising open interest + rising prices indicates\u2026",o:["New buying","New short selling","Liquidation","A thin market"],a:0,e:"Increasing OI accompanied by rising prices indicates new buying."},
{c:3,q:"Rising prices with rising volume indicate\u2026",o:["Market strength","Market weakness","A liquidating market","An oversold market"],a:0,e:"Rising prices + rising volume = strength. Falling prices + rising volume = weakness."},
{c:3,q:"A 'thin market' has\u2026",o:["Low volume and usually high volatility","High volume and low volatility","No price limits","Only hedgers"],a:0,e:"A thin market has low volume, usually with high price volatility."},
{c:3,q:"More speculation in futures markets tends to ___ long-term price volatility.",o:["Lower","Raise","Not affect","Double"],a:0,e:"The greater the speculation, the lower the long-term price volatility. Markets with little speculation are more volatile."},
{c:3,q:"Futures trading tends to ___ price volatility in the cash market.",o:["Reduce","Increase","Have no effect on","Eliminate"],a:0,e:"Economic research indicates futures trading tends to reduce cash market volatility."},
{c:3,q:"Fundamental analysis focuses on\u2026",o:["Factors affecting supply and demand","Chart patterns","Volume and open interest","Moving averages"],a:0,e:"Fundamental analysis looks at supply and demand factors for the underlying commodity."},
{c:3,q:"Economic or political instability will frequently ___ commodity prices.",o:["Drive up","Drive down","Freeze","Not affect"],a:0,e:"Instability frequently drives up commodity prices."},
{c:3,q:"Demand elasticity measures\u2026",o:["How much price changes alter the quantity purchased","How supply responds to price","Volume vs open interest","Basis movement"],a:0,e:"Demand elasticity: degree price changes alter quantity purchased. Supply elasticity: degree supply rises with price."},
{c:3,q:"The hog/corn ratio compares\u2026",o:["The value of hogs to their feeding costs","Hog futures to corn futures volume","Pork exports to corn exports","Hog prices to cattle prices"],a:0,e:"It's the relationship between the dollar value of hogs and related feeding costs (corn)."},
{c:3,q:"Which government policies directly impact commodity prices?",o:["Tax, monetary and agricultural policy","Only trade policy","No government policies","Only export licensing"],a:0,e:"Federal tax, monetary and agricultural policies have a direct impact on prices."},
{c:3,q:"Before trading, a successful speculator should have\u2026",o:["A profit objective and maximum loss in mind","A guaranteed return","No plan, to stay flexible","A hedging account"],a:0,e:"Know the contract, set profit objective and max loss, determine risk capital, analyse, follow a plan."},
{c:3,tf:1,q:"TRUE or FALSE: A double bottom is a bearish indicator.",o:["True","False"],a:1,e:"False. A double bottom (W shape) is bullish."},
{c:3,tf:1,q:"TRUE or FALSE: Volume is the number of contracts traded in a day.",o:["True","False"],a:0,e:"True. Volume is the daily number of contracts traded and measures the intensity behind a trend."},
{c:3,tf:1,q:"TRUE or FALSE: Leverage is magnified as price volatility increases.",o:["True","False"],a:0,e:"True. When speculating in futures, financial leverage is magnified as volatility increases."}
);
Q.push(
{c:4,q:"What is the only variable in a futures contract?",o:["Price","Quantity","Quality","Delivery date"],a:0,e:"All terms are standardised except price. (Margin requirements aren't standardised either.)"},
{c:4,q:"Where do futures trade?",o:["Only on an exchange","Only over the counter","On an exchange or over the counter","Only between private parties"],a:0,e:"Futures trade only on an exchange; prices come from supply and demand."},
{c:4,q:"Most futures positions end by\u2026",o:["Offsetting before delivery","Physical delivery","Cash settlement at expiry","Being rolled by the clearinghouse"],a:0,e:"Almost all positions are liquidated before delivery by offsetting."},
{c:4,q:"Are commodity and financial futures securities?",o:["No","Yes","Only financial futures","Only if exchange traded"],a:0,e:"Commodity and financial futures are not securities. Security futures (single stock / narrow index) ARE securities."},
{c:4,q:"Which is true of FORWARD contracts?",o:["Terms negotiated privately, no clearinghouse, no margin","Standardised and exchange-traded","Marked to market daily","Can be offset on an exchange"],a:0,e:"Forwards are private, non-standardised, not margined or marked to market, can't be offset, and have no clearinghouse guarantee."},
{c:4,q:"Unless told otherwise, assume a forward contract is a\u2026",o:["Cash forward","Fixed forward","Futures contract","Option"],a:0,e:"Always assume a cash forward (price set by the cash price on delivery day) unless the question says otherwise."},
{c:4,q:"In a FIXED forward the price is set\u2026",o:["When the contract is entered into","On the delivery day","By the exchange","Daily"],a:0,e:"Fixed forward: price determined at contract creation. Cash forward: price is the cash price on delivery day."},
{c:4,q:"Parties to a forward contract\u2026",o:["Expect to make and take delivery","Expect to offset","Expect cash settlement","Never deliver"],a:0,e:"Forwards are merchandising transactions \u2014 delivery is intended."},
{c:4,q:"19th-century specialised commodity markets developed because of the need for\u2026",o:["More capital, more credit and ways to cope with credit defaults","Faster communication","Government regulation","Lower taxes"],a:0,e:"Capital, credit and methods to cope with credit defaults."},
{c:4,q:"Which came first historically?",o:["Commodities trading","Securities trading","They began together","Options trading"],a:0,e:"Commodity trading developed many years before securities trading."},
{c:4,q:"Balance of payments surplus plus Fed tightening is ___ for the US dollar.",o:["Bullish","Bearish","Neutral","Irrelevant"],a:0,e:"A BoP surplus with a tightening Fed is bullish for the dollar."},
{c:4,q:"Which generally does NOT affect interest rate fluctuations?",o:["The unemployment rate","Fiscal policy","Monetary policy","The money supply"],a:0,e:"Interest rates are affected by fiscal and monetary policy and money supply \u2014 generally not by unemployment."},
{c:4,q:"Fed Funds are\u2026",o:["Excess reserves lent between Fed member banks","Treasury bills","Customer margin","Discount window loans"],a:0,e:"Federal Funds are excess reserves of Fed members that can be lent between member banks."},
{c:4,q:"US Treasury notes and bonds pay interest\u2026",o:["Semiannually","Monthly","Annually","Quarterly"],a:0,e:"T-notes and T-bonds pay interest semiannually."},
{c:4,q:"Long-term yields above short-term yields means the yield curve is\u2026",o:["Positive","Negative","Flat","Inverted"],a:0,e:"Long yields > short yields = positive yield curve."},
{c:4,q:"Expectations of rising short-term rates prompt banks to\u2026",o:["Issue large amounts of CDs","Stop issuing CDs","Buy T-bonds","Cut lending"],a:0,e:"Expecting rising short-term rates, banks issue large amounts of CDs to lock in funding."},
{c:4,q:"An increase in loan demand will ___ new CD issuance.",o:["Increase","Decrease","Not change","Halt"],a:0,e:"Commercial loans are funded with jumbo CDs, so more loan demand means more CDs."},
{c:4,q:"The money market deals in ___; the capital market in ___.",o:["Short-term debt; long-term debt and equity","Equity; debt","Long-term debt; short-term debt","Futures; options"],a:0,e:"Money market = short-term debt. Capital market = long-term debt and equities."},
{c:4,q:"A flour mill worried about rising wheat prices should\u2026",o:["Buy wheat futures (long hedge)","Sell wheat futures","Do nothing","Buy puts on flour"],a:0,e:"Buyers of a commodity hedge by buying futures \u2014 a long hedge protects against rising prices."},
{c:4,q:"A farmer with a crop to sell, worried about falling prices, should\u2026",o:["Sell futures (short hedge)","Buy futures","Buy calls","Sell puts"],a:0,e:"Sellers of a commodity sell futures \u2014 a short hedge protects against falling prices."},
{c:4,q:"Which is a typical LONG hedger?",o:["Importer or processor","Farmer","Holder of inventory","Exporter"],a:0,e:"Long hedgers: processors, manufacturers, importers. Short hedgers: farmers, producers, inventory holders, exporters."},
{c:4,q:"Which is a typical SHORT hedger?",o:["Exporter holding inventory","Importer","Manufacturer needing raw material","Processor"],a:0,e:"Exporters, farmers, producers and inventory holders are short hedgers."},
{c:4,q:"Why is long futures generally less risky than short?",o:["Price can only fall to zero; upside is unlimited","Long margin is lower","Shorts pay interest","Long positions can't get margin calls"],a:0,e:"A long's loss is limited because the price can only decline to zero; a short's loss is theoretically unlimited."},
{c:4,q:"Speculators provide the market with\u2026",o:["Liquidity, by assuming price risk","Physical delivery","Price limits","Clearing guarantees"],a:0,e:"Speculators assume price risk and so provide liquidity. They never intend to make or take delivery."},
{c:4,q:"A bearish speculator would\u2026",o:["Sell futures","Buy futures","Buy the cash commodity","Do a long hedge"],a:0,e:"Bearish speculators sell futures to profit from falling prices."},
{c:4,q:"Spreaders profit when\u2026",o:["The price difference between the two contracts changes","Both prices rise","Both prices fall","The market is limit locked"],a:0,e:"Spreaders buy the underpriced and sell the overpriced contract, profiting when the spread changes."},
{c:4,q:"Which is NOT risk capital?",o:["Savings accounts and life insurance policies","Money you can afford to lose","Surplus investable funds","Speculative capital"],a:0,e:"Risk capital does not include savings accounts and life insurance policies."},
{c:4,q:"Why have long-term investors moved into commodity pools and managed accounts?",o:["Diversification and inflation protection","Guaranteed returns","Tax exemption","No fees"],a:0,e:"Commodities are seen as a separate asset class offering diversification and inflation protection."},
{c:4,tf:1,q:"TRUE or FALSE: Margin requirements are standardised in every futures contract.",o:["True","False"],a:1,e:"False. Contract terms are standardised but margin requirements are not."},
{c:4,tf:1,q:"TRUE or FALSE: Speculators trade in both the cash and futures markets.",o:["True","False"],a:1,e:"False. Speculators trade only in futures; they have no financial interest in the underlying."},
{c:4,tf:1,q:"TRUE or FALSE: Today, short-term futures trading dominates the market.",o:["True","False"],a:0,e:"True, per the book's history section."}
);
Q.push(
{c:5,q:"Which NFA rule is 'Know Your Customer'?",o:["Rule 2-30","Rule 2-29","Rule 2-38","Rule 2-36"],a:0,e:"Rule 2-30 is Know Your Customer."},
{c:5,q:"Whose approval is needed to open a new futures account?",o:["The branch manager's","The AP's","The NFA's","The clearinghouse's"],a:0,e:"The member firm's branch manager must approve a new futures trading account."},
{c:5,q:"How often must an FCM request updated info from active customers?",o:["At least annually","Every 2 years","Quarterly","Only at account opening"],a:0,e:"At least annually. If the customer doesn't respond, prior info is considered verified."},
{c:5,q:"Which is NOT required when opening a new futures account?",o:["Educational background","True name and address","Approximate age","Estimated income and net worth"],a:0,e:"Required: name/address, occupation, income & net worth (no verification), approx. age, prior trading experience. Education is not needed."},
{c:5,q:"Must a customer's stated income and net worth be verified?",o:["No","Yes, with tax returns","Yes, with bank statements","Only above $1m"],a:0,e:"Estimated annual income and net worth are required, but verification is not."},
{c:5,q:"Trade confirmations must be sent\u2026",o:["The next business day after execution","Same day","Within 3 business days","Monthly"],a:0,e:"Written confirmations go out the next business day after execution."},
{c:5,q:"A QEP must generally own securities worth at least\u2026",o:["$2,000,000","$1,000,000","$200,000","$5,000,000"],a:0,e:"$2m in securities, OR an FCM account for 6+ months with $200,000+ in initial margin/premiums. Accredited Investors are not QEPs."},
{c:5,q:"Generally a customer should commit no more than ___ of capital available for margin trading.",o:["50%","25%","75%","10%"],a:0,e:"Commit 50% or less; keep the other 50% in reserve."},
{c:5,q:"A main purpose of the Commodity Customer Agreement is to\u2026",o:["Let the broker liquidate positions if margin isn't met","Authorise fund transfers","Grant discretion","Waive arbitration"],a:0,e:"It gives the broker authority to liquidate positions if margin requirements aren't met."},
{c:5,q:"To use a surplus in a commodity account to pay a debit in a stock account, the customer needs\u2026",o:["A Supplemental Commodity Customer Agreement","Nothing extra","A power of attorney","A discretionary agreement"],a:0,e:"Transfers need a Supplemental Commodity Customer Agreement (Transfer of Funds Agreement); it's not in the regular agreement."},
{c:5,q:"An account is opened through an agent (e.g. a CTA). What must be obtained?",o:["A copy of the power of attorney and a letter on whether the agent shares profits","Nothing","The agent's tax return","NFA approval"],a:0,e:"Get the POA plus a letter saying whether the agent participates in profits."},
{c:5,q:"Which is NOT in the verbatim risk statement?",o:["Stop loss orders will always limit losses","You may lose your entire investment","Spreads may not be less risky","It may be impossible to liquidate a position"],a:0,e:"The statement says stop loss orders may NOT limit losses."},
{c:5,q:"Can an AP share in a customer's profits on verbal authorisation?",o:["No \u2014 prior written authorisation needed","Yes","Yes, if under $5,000","Only for discretionary accounts"],a:0,e:"There must be prior written authorisation."},
{c:5,q:"Futures margin is best described as\u2026",o:["A performance bond","A down payment","Customer equity","A loan"],a:0,e:"Futures margin is a performance bond to cover default risk, not a down payment or equity."},
{c:5,q:"Initial clearing margin is roughly ___ of face value.",o:["2%\u20135%","10%\u201315%","25%","50%"],a:0,e:"Set by the clearinghouse at about 2%\u20135% of face value, based on risk."},
{c:5,q:"Variation margin must be paid\u2026",o:["Within 1 hour, in cash","By next day","Within 5 days","In any collateral"],a:0,e:"Variation margin (an intraday call) is due within 1 hour and must be cash."},
{c:5,q:"A margin call restores the account to\u2026",o:["Initial margin","Maintenance margin","Zero","75% of initial"],a:0,e:"A margin call brings the account back up to the initial margin level."},
{c:5,q:"Maintenance margin is usually about ___ of initial margin.",o:["75%","50%","25%","90%"],a:0,e:"Maintenance margin is usually about 75% of initial."},
{c:5,q:"Initial margin on corn is $0.15/bu and maintenance $0.13/bu. Long at $2.55, a call comes if price falls below\u2026",o:["$2.53","$2.40","$2.42","$2.52"],a:0,e:"Variance is $0.02, so $2.55 \u2212 $0.02 = $2.53."},
{c:5,q:"Why is hedge account margin lower than speculative margin?",o:["Hedgers handle the physical, so price risk is lower","Hedgers are bigger","Regulators favour farmers","It isn't lower"],a:0,e:"Hedge accounts handle the physical commodity, so risk of price change is lower."},
{c:5,q:"Spread margin is lower because\u2026",o:["The two legs' price difference is less volatile","Spreads are risk free","Only one leg is margined","Hedgers use spreads"],a:0,e:"The price difference between the legs usually fluctuates much less than an outright position."},
{c:5,q:"On which exchange is margin computed on BOTH long and short positions rather than net?",o:["CME","CBOT","NYMEX","ICE"],a:0,e:"Normally margin is on the net position, but the CME computes on both longs and shorts."},
{c:5,q:"Who sets the initial and maintenance margin a member must collect from customers?",o:["The exchange's Board of Directors","The CFTC","The NFA","The FCM alone"],a:0,e:"Set by the exchange boards, using SPAN. FCMs may be stricter, never looser."},
{c:5,q:"The margin system used by all US futures exchanges is\u2026",o:["SPAN","VaR","Reg T","TIMS"],a:0,e:"SPAN \u2014 Standard Portfolio Analysis of Risk."},

{c:5,q:"An exchange raises margins. Which positions are affected?",o:["Both new and existing","New only","Existing only","Spreads only"],a:0,e:"Increases in initial and maintenance margin affect all positions, new and existing."},
{c:5,q:"A customer's credit is above maintenance but below initial. Can it margin a new position?",o:["No","Yes","Only half","Only for hedges"],a:0,e:"Only credits in excess of the INITIAL requirement may go toward a new commitment."},
{c:5,q:"A customer deposits $10,000 of stock as margin at CME. How much counts?",o:["$7,000","$10,000","$5,000","$3,000"],a:0,e:"70% of market value counts; the haircut on US equities is 30%."},
{c:5,q:"Margin due is based on\u2026",o:["The settlement price","The opening price","The intraday high","The average price"],a:0,e:"Margin is based on the settlement price \u2014 the last trade of the day."},
{c:5,q:"Who has primary responsibility for collecting customer margin?",o:["The AP","The clearinghouse","The NFA","The exchange"],a:0,e:"The associated person has the primary responsibility for collecting margin."},
{c:5,q:"A customer doesn't meet a margin call promptly. The FCM\u2026",o:["May close out the account but isn't obliged to","Must close out immediately","Must report to the CFTC","Must wait 5 days"],a:0,e:"The FCM may close out the account, but is not obligated to."},
{c:5,q:"Clearing members must deposit additional margin\u2026",o:["Before the market opens the next day","Within a week","At month end","Within 1 hour, always"],a:0,e:"After each session clearing members' margin is computed; extra margin must be in before next day's open."},
{c:5,q:"Can one customer's excess margin cover another customer's requirement?",o:["Yes, with written authorisation","Never","Yes, automatically","Only within a family"],a:0,e:"Allowed with written authorisation."},
{c:5,q:"Opening a discretionary account requires\u2026",o:["Prior written authorisation (e.g. power of attorney)","Verbal consent","Financial statements","CFTC approval"],a:0,e:"Prior written authorisation is required. Customers needn't file financial statements."},
{c:5,q:"Who must initial all discretionary orders?",o:["A partner or officer","The customer","The AP","The floor broker"],a:0,e:"Discretionary orders must be marked as such on the ticket and initialled by a partner or officer."},
{c:5,q:"Minimum experience before a broker may handle a discretionary account?",o:["2 years","1 year","3 years","5 years"],a:0,e:"Exchange and NFA rules require 2 years of experience in good standing."},
{c:5,q:"Minimum equity for a discretionary account?",o:["$5,000","$2,000","$10,000","$25,000"],a:0,e:"The minimum equity requirement for discretionary accounts is $5,000."},
{c:5,q:"An AP chooses only the time and price of a customer's order. Is written discretion needed?",o:["No","Yes","Only for options","Only on CME"],a:0,e:"Discretion over time and price only does not need written authorisation."},
{c:5,q:"Under CBOT rules, a discretionary power of attorney is good\u2026",o:["Until revoked in writing","For 1 year","For 6 months","Until the AP leaves"],a:0,e:"Good until revoked; revocation must be in writing."},
{c:5,q:"On CME, can floor brokers execute orders for discretionary accounts they control?",o:["No","Yes","Only spreads","Only day trades"],a:0,e:"CME floor brokers may not execute orders for discretionary accounts over which they hold authority."},
{c:5,tf:1,q:"TRUE or FALSE: Accredited Investors automatically qualify as QEPs.",o:["True","False"],a:1,e:"False. Accredited Investors are not Qualified Eligible Participants."},
{c:5,tf:1,q:"TRUE or FALSE: An inactive account must keep maintenance margin to stay open.",o:["True","False"],a:1,e:"False. No maintenance is required to keep an inactive account open."},
{c:5,tf:1,q:"TRUE or FALSE: Margin requirements are generally the same for longs and shorts.",o:["True","False"],a:0,e:"True."}
);
Q.push(
{c:6,q:"An order with no expiry time stated is treated as\u2026",o:["A day order","GTC","FOK","An open order for a week"],a:0,e:"No expiry stated = day order."},
{c:6,q:"A GTC order stays live until\u2026",o:["Cancelled or the contract reaches its delivery month","End of the week","End of the day","30 days"],a:0,e:"GTC runs until the customer cancels or the contract reaches its delivery month."},
{c:6,q:"A sell limit order can be executed only if price\u2026",o:["Rises to the limit or above","Falls to the limit or below","Touches the limit once","Is limit locked"],a:0,e:"Sell limit: at the limit price or higher. Buy limit: at the limit or lower."},
{c:6,q:"The initials 'OB' on an order identify it as\u2026",o:["A limit order","A stop order","An MIT","A market order"],a:0,e:"OB = 'or better', which identifies limit orders (also called resting orders)."},
{c:6,q:"The ticker shows a trade at a customer's limit price. Can the AP tell them they've been filled?",o:["No","Yes","Only for buy limits","Only after an hour"],a:0,e:"A customer may not be told they're filled just because the ticker shows a trade at their price."},
{c:6,q:"A buy stop is placed ___ the market; a sell stop ___ the market.",o:["Above; below","Below; above","At; at","Below; below"],a:0,e:"BL/SS chart: Sell Limit and Buy Stop sit above the market; Buy Limit and Sell Stop sit below."},
{c:6,q:"Which orders are placed BELOW the current market?",o:["Buy limit and sell stop","Sell limit and buy stop","Buy stop and buy limit","Sell stop and sell limit"],a:0,e:"Below market: Buy Limit / Sell Stop (BL/SS)."},
{c:6,q:"When the stop price is hit, a stop order becomes\u2026",o:["A market order","A limit order","Cancelled","An MIT"],a:0,e:"A stop is activated at the stop price and becomes a market order."},
{c:6,q:"A sell stop protecting an existing long is also called\u2026",o:["A protective or trailing stop","A buy limit","An MIT","A give-up"],a:0,e:"A sell stop is a protective/trailing stop \u2014 a stop loss to liquidate an existing position."},
{c:6,q:"Does a stop loss order guarantee the size of the loss?",o:["No","Yes","Only in liquid markets","Only on CME"],a:0,e:"Stop loss orders don't guarantee a loss limited to a set amount or a fill at the stop price."},
{c:6,q:"The most important factor in choosing a stop price is\u2026",o:["Price volatility","Volume","Commission","Open interest"],a:0,e:"Price volatility is the most important factor when selecting a stop price."},
{c:6,q:"A stop limit order, once the stop is hit, becomes\u2026",o:["A limit order","A market order","An MIT","Cancelled"],a:0,e:"Stop limit = 2 orders on 1 ticket: at the stop it becomes a limit order, executed only at the limit or better."},
{c:6,q:"An MIT order to BUY is activated when the contract\u2026",o:["Sells or is offered at or below the order price","Sells or is bid at or above","Hits the daily limit","Reaches settlement"],a:0,e:"Buy MIT activates at/below the price (like a buy limit) and then becomes a market order."},
{c:6,q:"An MIT order to SELL is activated when the contract\u2026",o:["Sells or is bid at or above the order price","Sells or is offered at or below","Opens","Closes"],a:0,e:"Sell MIT activates at/above the price and then becomes a market order."},
{c:6,q:"MIT orders can be used for\u2026",o:["Futures, but not stocks and bonds","Stocks only","Bonds only","All securities"],a:0,e:"MIT orders can be used for futures, not stocks and bonds."},

{c:6,q:"A broker executes for another broker's client and passes the commission on. This is a\u2026",o:["Give up","Bucketing","Cross trade","Block trade"],a:0,e:"Give up: executing broker 'gives up' the commission to the client's broker."},

{c:8,q:"Hedging shifts price risk mainly to\u2026",o:["Speculators","The clearinghouse","The CFTC","Other hedgers only"],a:0,e:"The purpose of hedging is to shift price risk to others, generally speculators."},

{c:8,q:"In a short hedge, if prices rise\u2026",o:["The futures loss is offset by the higher cash sale price","Both sides profit","Both sides lose","The hedge is cancelled"],a:0,e:"Rising prices: loss on short futures, but a higher price in the cash sale."},
{c:8,q:"The basis formula is\u2026",o:["Cash \u2212 Futures","Futures \u2212 Cash","Cash + Futures","Futures \u00f7 Cash"],a:0,e:"BASIS = CASH \u2212 FUTURES."},
