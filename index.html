RN(2,"Which of the following are TRUE of daily price limits?",["I. They're measured from the previous day's settlement price","II. Trading must stop when the limit is hit","III. Changes to limits need CFTC approval","IV. They guarantee you can offset that day"],["I and III","I and II","II and IV","I, III and IV"],"Limits freeze prices, not trading, and they don't guarantee an offset."),
RN(3,"Which of the following chart patterns are BULLISH?",["I. Double bottom","II. Inverted head and shoulders","III. Double top","IV. Ascending triangle"],["I, II and IV","I and III","II and III","I, II, III and IV"],"A double top (M shape) is bearish."),
RN(3,"Which of the following are features of a LIQUIDATING market?",["I. Longs selling their positions","II. Shorts buying to cover","III. Rising open interest","IV. New buyers entering"],["I and II","I and III","II and IV","I, II and III"],"Liquidation means offsetting, so open interest falls."),
RN(3,"Which of the following are tools of FUNDAMENTAL analysis?",["I. Crop and weather reports","II. Government agricultural policy","III. Moving averages","IV. Demand elasticity"],["I, II and IV","I and III","III only","I, II, III and IV"],"Moving averages are technical analysis."),
RN(4,"Which of the following are characteristics of FORWARD contracts?",["I. Terms are privately negotiated","II. There is no clearinghouse guarantee","III. They're marked to market daily","IV. They can be offset on an exchange"],["I and II","I and III","II and IV","I, II and III"],"Forwards aren't margined, marked to market or offset on an exchange."),
RN(4,"Which of the following would normally put on a LONG hedge?",["I. A food processor","II. An importer","III. A farmer","IV. An exporter holding inventory"],["I and II","III and IV","I and IV","II and III"],"Buyers of the commodity go long. Producers and holders of inventory go short."),
RN(4,"Which of the following are TRUE of speculators?",["I. They provide liquidity","II. They assume price risk","III. They intend to make or take delivery","IV. They trade in the cash market"],["I and II","I and III","II and IV","I, II, III and IV"],"Speculators trade futures only and don't intend to deliver."),
RN(5,"Which of the following must be obtained when opening a futures account?",["I. True name and address","II. Approximate age","III. Educational background","IV. Prior trading experience"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Education isn't required."),
RN(5,"Which are requirements for a discretionary account?",["I. Prior written authorisation","II. The AP has at least 2 years' experience","III. Minimum equity of $5,000","IV. The customer files financial statements"],["I, II and III","I and IV","II and III","I, II, III and IV"],"Customers don't need to file financial statements."),
RN(5,"Which of the following are TRUE of futures margin?",["I. It's a performance bond","II. Maintenance is usually about 75% of initial","III. A margin call restores the account to maintenance","IV. Variation margin is due within 1 hour, in cash"],["I, II and IV","I and III","II and III","I, II, III and IV"],"A margin call restores the account to INITIAL margin."),
RN(5,"Which customers qualify as Qualified Eligible Participants (QEPs)?",["I. Owns at least $2,000,000 of securities","II. Is an Accredited Investor","III. Has had an FCM account for 6+ months with $200,000+ in initial margin or premiums"],["I and III","I and II","II only","I, II and III"],"Accredited Investors are NOT automatically QEPs."),
RN(6,"Which orders are placed ABOVE the current market price?",["I. Sell limit","II. Buy stop","III. Buy limit","IV. Sell stop"],["I and II","III and IV","I and IV","II and III"],"BL/SS go below the market; SL/BS go above."),
RN(6,"Which orders become MARKET orders once triggered?",["I. Stop order","II. Market-if-touched (MIT)","III. Stop limit order","IV. Fill or kill"],["I and II","I and III","II and IV","I, II and III"],"A stop limit becomes a LIMIT order. FOK is a type of limit order."),
RN(6,"Which of the following terms mean closing out a position?",["I. Offset","II. Liquidate","III. Initiate","IV. Lifted"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Initiate means opening a position."),
RN(7,"Which of the following futures are CASH settled?",["I. Stock index futures","II. Eurodollar futures","III. Corn futures","IV. Gold futures"],["I and II","III and IV","I and IV","I, II and III"],"Stock index and Eurodollar futures settle in cash. Grains and metals are deliverable."),
RN(7,"Which contract sizes are CORRECT?",["I. Grains: 5,000 bushels","II. Gold: 100 troy ounces","III. Crude oil: 42,000 gallons","IV. Live cattle: 40,000 pounds"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Crude is 1,000 barrels. 42,000 gallons is heating oil and gasoline."),
RN(7,"Which of the following are TRUE of stock index futures?",["I. They're cash settled","II. They have no daily price limits","III. Final settlement is the 3rd Friday","IV. The E-mini S&P 500 is $50 \u00d7 the index"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Final settlement is the THURSDAY before the 3rd Friday."),
RN(7,"A US importer must pay Swiss francs in 3 months. To hedge, it should:",["I. Buy Swiss franc futures","II. Sell Swiss franc futures","III. Put on a long hedge","IV. Put on a short hedge"],["I and III","II and IV","I and IV","II and III"],"Paying foreign currency means buying it, so buy futures: a long hedge."),
RN(8,"A short hedger would profit if the basis:",["I. Strengthens","II. Weakens","III. Moves from \u221220 to \u221210","IV. Moves from +5 to \u22125"],["I and III","II and IV","I and IV","II and III"],"Short likes Strong. \u221220 \u2192 \u221210 is the number going up, which is strengthening."),
RN(8,"Which of the following are TRUE of hedging?",["I. It shifts price risk to speculators","II. With futures, a hedger should be slightly under-hedged","III. Hedgers put on spreads","IV. A cross hedge uses a closely related commodity"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Hedgers never put on spreads; they're either long or short."),
RN(8,"Which of the following would hedge by BUYING futures?",["I. A flour mill fearing rising wheat prices","II. A treasurer due to invest cash later, fearing falling rates","III. A farmer with a crop in the ground","IV. A bondholder fearing rising rates"],["I and II","III and IV","I and IV","II and III"],"Falling rates mean rising bond prices, so the treasurer buys futures. A bondholder fearing rising rates sells."),
RN(9,"Which of the following are INTER-COMMODITY spreads?",["I. Long July wheat / short July corn","II. Long Dec corn / short Mar corn","III. A soybean crush","IV. Long CBOT Dec wheat / short Dec wheat on another exchange"],["I and III","I and II","II and IV","III and IV"],"II is inter-delivery (same commodity, different months). IV is inter-market (different exchanges)."),
RN(9,"Which of the following describe a NORMAL (contango) market?",["I. Cash is below futures","II. The basis is negative","III. Cash supplies are short","IV. Deferred months reflect carrying charges"],["I, II and IV","I and III","II and III","I, II, III and IV"],"Short cash supply is a sign of an inverted market."),
RN(10,"Which of the following positions are BULLISH?",["I. Long call","II. Short put","III. Long put","IV. Short call"],["I and II","III and IV","I and IV","II and III"],"If exercised, the call buyer and the put seller both end up long futures."),
{c:10,q:"A corn trader establishes the following position. Which of the following are TRUE?",l:["Long 1 September corn 480 put","Short 1 September corn 460 put","","I. The position is a vertical spread","II. The trader is bullish","III. It's a credit spread","IV. It's a debit spread"],o:["I and IV","I and III","II and III","II and IV"],a:0,rn:1,e:"Same expiry, different strikes = vertical. The 480 put costs more than the 460 put, so it's a DEBIT. Buying the higher-strike put is a BEAR spread."},
{c:10,q:"A crude trader establishes the following position. Which of the following are TRUE?",l:["Long 1 December crude 80 call","Short 1 December crude 75 call","","I. The position is a vertical spread","II. The trader is bearish","III. It's a credit spread","IV. It's a debit spread"],o:["I, II and III","I, II and IV","II and IV","I and IV"],a:0,rn:1,e:"Selling the lower-strike (more valuable) call takes in more premium than you pay, so it's a CREDIT. Buying the higher strike and selling the lower = bear spread."},
RN(10,"Which of the following are TRUE of the option Greeks?",["I. Delta measures premium change relative to the futures price","II. Theta measures time decay","III. Vega measures sensitivity to volatility","IV. Gamma measures sensitivity to interest rates"],["I, II and III","I and IV","II and III","I, II, III and IV"],"Gamma measures how fast DELTA changes."),
RN(10,"Which of the following are TRUE of a SHORT straddle?",["I. Maximum gain is the total premium received","II. Maximum loss is unlimited","III. It profits from a big move either way","IV. The writer expects a stable market"],["I, II and IV","I and III","II and III","I, II, III and IV"],"A LONG straddle profits from a big move. A short straddle wants the market to sit still."),
RN(10,"Which of the following are TRUE for the BUYER of an option on futures?",["I. The premium is paid T+1","II. The buyer must post margin","III. Maximum loss is the premium","IV. An American-style option can be exercised any business day up to expiry"],["I, III and IV","I and II","II and III","I, II, III and IV"],"Sellers post margin; buyers just pay the premium."),

/* ---------- True / False statements ---------- */
TF(1,"An independent Introducing Broker must maintain adjusted net capital of at least $45,000.",1,"True. Independent IB: $45,000. FCM: $1,000,000."),
TF(1,"A guaranteed IB may have guarantee agreements with two FCMs at the same time.",0,"False. Only one guarantee agreement at a time."),
TF(1,"The clearinghouse is the counterparty to every futures trade.",1,"True. That's how it guarantees trades."),
TF(1,"In an omnibus account, the clearing FCM is given the names of the correspondent FCM's customers.",0,"False. Omnibus accounts don't disclose the customers' names."),
TF(1,"A CTA may accept customer funds in its own name.",0,"False. Not unless it's also registered as an FCM."),
TF(1,"A CPO may use its Disclosure Document for up to 18 months after the date of the document.",0,"False. 12 months."),
TF(1,"The settlement price is the same as the closing range.",0,"False. Per the book, the settlement price is the last trade of the day."),
TF(1,"A scalper usually holds positions for days or weeks.",0,"False. Scalpers hold for minutes. Position traders hold for days or weeks."),
TF(1,"Funds sent to a commodity pool must be received in the pool's name.",1,"True. Never in the CPO's or CTA's name, and no commingling."),
TF(2,"A CFTC Commissioner may trade futures as long as the trades are disclosed.",0,"False. It's a felony for a Commissioner or CFTC employee to trade futures."),
TF(2,"Exchange arbitration is mandatory for members but voluntary for customers.",1,"True."),
TF(2,"A $200,000 arbitration claim is heard by a single arbitrator.",0,"False. Claims over $150,000 get 3 arbitrators."),
TF(2,"An NFA member may resign while it is under NFA investigation.",0,"False."),
TF(2,"Decisions of the NFA Appeals Committee are final and binding.",1,"True, per the book: there's no further right of appeal."),
TF(2,"When a market hits its daily price limit, trading must stop for the rest of the day.",0,"False. Trading can continue at or within the limit."),
TF(2,"Bona fide hedgers are exempt from position limits.",1,"True."),
TF(2,"Spread positions are exempt from position limits.",0,"False. Spreads ARE subject to position limits."),
TF(2,"Promotional material must be approved in writing by a supervisor before its first use.",1,"True. Rule 2-29."),
TF(2,"Voluntarily submitting promotional material to the NFA for review gives the member a safe harbor.",0,"False. There's no safe harbor."),
TF(2,"Everyone, including hedgers, must file daily reports with the CFTC once reportable levels are reached.",1,"True."),
TF(3,"A double top is a bearish formation.",1,"True. M shape = bearish."),
TF(3,"Rising open interest combined with falling prices indicates new buying.",0,"False. It indicates new SHORT selling."),
TF(3,"A thin market usually has low volume and high price volatility.",1,"True."),
TF(3,"Greater speculation tends to increase long-term price volatility.",0,"False. More speculation tends to LOWER long-term volatility."),
TF(4,"Forward contracts are marked to market daily.",0,"False. Forwards aren't margined or marked to market."),
TF(4,"Speculators provide liquidity to the futures market by assuming price risk.",1,"True."),
TF(4,"A flour mill hedges against rising wheat prices by selling wheat futures.",0,"False. A buyer of the commodity hedges by BUYING futures."),
TF(4,"Commodity and financial futures are securities.",0,"False. Only security futures (single stock / narrow index) are securities."),
TF(5,"Futures margin is a down payment on the contract.",0,"False. It's a performance bond."),
TF(5,"A margin call restores the account to the maintenance margin level.",0,"False. It restores the account to INITIAL margin."),
TF(5,"Variation margin must be paid within one hour, in cash.",1,"True."),
TF(5,"A customer's stated income and net worth must be verified before the account is opened.",0,"False. They're required, but verification is not."),
TF(5,"A discretionary account requires prior written authorisation from the customer.",1,"True."),
TF(5,"An AP needs written authorisation to choose only the time and price of a customer's order.",0,"False. Discretion over time and price only doesn't need written authorisation."),
TF(5,"An FCM may set customer margin below the exchange minimum for its best clients.",0,"False. FCMs can be stricter, never looser."),
TF(6,"A buy stop order is placed below the current market price.",0,"False. Buy stops go ABOVE the market."),
TF(6,"A sell limit order can only be filled at the limit price or higher.",1,"True."),
TF(6,"A stop limit order is guaranteed to be filled once the stop price is hit.",0,"False. It becomes a limit order, so it may never fill."),
TF(6,"An order with no time instruction is treated as good-till-cancelled.",0,"False. It's treated as a DAY order."),
TF(6,"A fill or kill order must be filled in its entirety immediately, or it is cancelled.",1,"True."),
TF(7,"Stock index futures settle by delivery of the underlying shares.",0,"False. They're cash settled."),
TF(7,"One 32nd on a T-bond futures contract is worth $31.25.",1,"True."),
TF(7,"Options on Treasury bond futures are quoted in 32nds.",0,"False. The options are quoted in 64ths ($15.625 each); the futures are in 32nds."),
TF(7,"A US exporter due to receive euros in 3 months should buy euro futures.",0,"False. Receiving foreign currency \u2192 SELL that currency's futures."),
TF(7,"Gold futures cover 100 troy ounces.",1,"True. Silver covers 5,000 troy ounces."),
TF(7,"Live cattle and lean hog futures both cover 40,000 pounds.",1,"True. Feeder cattle is 50,000 pounds."),
TF(8,"A short hedger profits when the basis strengthens.",1,"True. Short likes Strong."),
TF(8,"If the basis doesn't change over the life of the hedge, it's a perfect hedge.",1,"True."),
TF(8,"The basis is calculated as the futures price minus the cash price.",0,"False. Basis = CASH \u2212 FUTURES."),
TF(8,"A hedger using futures should be slightly over-hedged.",0,"False. With futures, perfectly or slightly UNDER-hedged. With options, slightly over."),
TF(8,"As delivery approaches, cash and futures prices tend to converge.",1,"True. Arbitrage pulls the basis toward zero."),
TF(9,"A bull spread is long the nearby month and short the deferred month.",1,"True."),
TF(9,"Buying July wheat and selling July corn is an inter-delivery spread.",0,"False. Different commodities = INTER-COMMODITY spread."),
TF(9,"In an inverted market, cash prices are above futures prices.",1,"True. That signals short supply."),
TF(9,"Live cattle futures normally carry large storage charges.",0,"False. Cattle aren't stored, so there are normally no carrying charges."),
TF(10,"When an investor writes a put with no other position, the maximum loss is unlimited.",0,"False. The futures price can only fall to zero, so the max loss is strike \u2212 premium."),
TF(10,"A long straddle is the purchase of a call and a put on the same futures contract with the same strike price and expiry month.",1,"True."),
TF(10,"A diagonal spread is one long call and one short put on the same futures contract.",0,"False. A diagonal spread uses options of the same type with different strikes AND different expiries."),
TF(10,"The maximum gain on a short straddle is the total premium received.",1,"True."),
TF(10,"If a put is exercised, the put buyer is assigned a long futures position.",0,"False. The put buyer gets a SHORT future; the put seller gets the long."),
TF(10,"Theta measures an option's sensitivity to volatility.",0,"False. Theta is time decay. Vega is volatility."),
TF(10,"A call option is in the money when the futures price is below the strike price.",0,"False. A call is in the money when futures are ABOVE the strike."),
TF(10,"When hedging with options, a hedger should be perfectly or slightly over-hedged.",1,"True. (With futures it's the opposite: slightly under-hedged.)"),

/* ---------- Position scenarios (calculations) ---------- */
{c:10,q:"With silver futures trading at 24.60, an investor establishes the following position. The investor breaks even at expiration if silver is trading at:",l:["Long 3 December silver 24 calls at 1.15"],o:["25.15","22.85","25.75","27.45"],a:0,e:"Long call breakeven = strike + premium = 24 + 1.15 = 25.15. The number of contracts and the current price don't matter."},
{c:10,q:"An investor buys the following with March feeder cattle trading at 252.00. Each contract covers 50,000 pounds. What's the total premium paid?",l:["Long 3 March feeder cattle 250 calls at 4.00 (cents/lb)"],o:["$6,000","$2,000","$60,000","$600"],a:0,e:"4.00\u00a2 = $0.04 \u00d7 50,000 lb = $2,000 per contract \u00d7 3 = $6,000."},
{c:10,q:"July wheat futures are 6.24 and cash wheat is 6.20. July 6.10 wheat calls trade at 18 cents. The calls have time value of:",o:["4 cents","8 cents","14 cents","18 cents"],a:0,e:"Options on futures are valued against the FUTURES price, not cash. Intrinsic = 6.24 \u2212 6.10 = 14\u00a2. Time value = 18 \u2212 14 = 4\u00a2."},
{c:10,q:"A trader holds the position below. December corn futures are at 430 at expiration. What's the result?",l:["Long 1 December corn 450 put at 12"],o:["$400 profit","$1,000 profit","$600 loss","$600 profit"],a:0,e:"Intrinsic = 450 \u2212 430 = 20\u00a2. Less 12\u00a2 premium = 8\u00a2 \u00d7 $50 = $400 profit."},
{c:10,q:"A trader holds the position below. March crude futures are at 84 at expiration. What's the result?",l:["Short 2 March crude 80 calls at 2.50"],o:["$3,000 loss","$5,000 profit","$1,500 loss","$8,000 loss"],a:0,e:"The call is 4.00 in the money. Premium received 2.50 \u2192 loss of 1.50 \u00d7 1,000 bbl = $1,500 per contract \u00d7 2 = $3,000 loss."},
{c:10,q:"What is the total premium for the following position?",l:["Long 2 August gold 2,300 calls at 32.40"],o:["$6,480","$3,240","$648","$64,800"],a:0,e:"Gold options: 1 point = $100. 32.40 \u00d7 $100 = $3,240 \u00d7 2 = $6,480."},
{c:10,q:"An option on T-bond futures is quoted at 1-48. What is the premium?",o:["$1,750","$2,500","$1,480","$1,048"],a:0,e:"T-bond options are in 64ths. 1 point = $1,000 plus 48/64 \u00d7 $1,000 = $750. Total $1,750. (Reading it as 32nds gives $2,500.)"},
{c:10,q:"Futures rise by 3.00 and an option has a delta of 0.40. The option premium should change by about:",o:["+1.20","+3.00","+1.80","+7.50"],a:0,e:"3.00 \u00d7 0.40 = 1.20."},
{c:8,q:"A farmer puts on the hedge below. What is the net price received for the corn?",l:["April: cash corn 4.30, sells Dec futures at 4.55","October: sells cash corn at 3.95, buys back Dec futures at 4.15"],o:["4.35","3.55","3.95","4.15"],a:0,e:"Futures: sold 4.55, bought 4.15 = +0.40. Net = 3.95 + 0.40 = 4.35. (Basis went \u221225 \u2192 \u221220: strengthened 5, good for a short hedge.)"},
{c:8,q:"A processor puts on the hedge below. What is the net cost of the soybeans?",l:["February: cash soybeans 11.80, buys July futures at 12.10","June: buys cash soybeans at 12.40, sells July futures at 12.60"],o:["11.90","12.90","11.80","12.40"],a:0,e:"Futures: bought 12.10, sold 12.60 = +0.50. Net cost = 12.40 \u2212 0.50 = 11.90. (Basis \u221230 \u2192 \u221220 strengthened, which costs a long hedger 10\u00a2.)"},
{c:8,q:"A grain elevator holding inventory puts on the hedge below. What happened to the basis, and how did it affect the hedge?",l:["January: cash 2.50, sells futures at 2.70","June: cash 2.30, buys futures at 2.45"],o:["Strengthened by 5\u00a2: hedge gained 5\u00a2","Weakened by 5\u00a2: hedge lost 5\u00a2","Strengthened by 5\u00a2: hedge lost 5\u00a2","Weakened by 15\u00a2: hedge gained 15\u00a2"],a:0,e:"Opening basis 2.50 \u2212 2.70 = \u221220. Closing 2.30 \u2212 2.45 = \u221215. Up 5 = strengthened. Short likes Strong: +5\u00a2."},
{c:8,q:"A customer has $2,500 margin on deposit and makes a $1,000 profit. What's the percentage profit?",o:["40%","25%","250%","4%"],a:0,e:"% profit = profit \u00f7 margin deposit = 1,000 \u00f7 2,500 = 40%."},
{c:9,q:"A trader puts on the spread below. What's the result?",l:["Buy 2 May wheat at 6.10, sell 2 July wheat at 6.30","Later: May wheat 6.32, July wheat 6.40"],o:["$1,200 gain","$1,200 loss","$600 gain","$3,200 gain"],a:0,e:"May +0.22, July \u22120.10 (sold 6.30, now 6.40) = +0.12 \u00d7 5,000 = $600 \u00d7 2 = $1,200 gain."},
{c:9,q:"A trader puts on the spread below. What's the result?",l:["Sell 1 June gold at 2,350, buy 1 December gold at 2,395","Later: June 2,380, December 2,440"],o:["$1,500 gain","$1,500 loss","$4,500 gain","$7,500 loss"],a:0,e:"June \u221230 (sold 2,350, now 2,380), December +45 = +15 \u00d7 100 oz = $1,500 gain."},
{c:7,q:"A customer buys 3 September T-bond futures at 115-12 and sells them at 113-28. What's the result?",o:["$4,500 loss","$1,500 loss","$2,250 loss","$4,500 gain"],a:0,e:"115-12 \u2212 113-28 = 1-16 = 48/32. 48 \u00d7 $31.25 = $1,500 per contract \u00d7 3 = $4,500 loss."},
{c:7,q:"A customer is short 4 three-month T-bill futures at 96.10 and covers at 96.35. What's the result?",o:["$2,500 loss","$2,500 gain","$10,000 loss","$625 loss"],a:0,e:"Sold 96.10, bought 96.35 = \u221225 basis points \u00d7 $25 \u00d7 4 = $2,500 loss. (Using $100 per bp, the 12-month value, gives $10,000.)"},
{c:7,q:"A manager wants to hedge a $9,000,000 stock portfolio with E-mini S&P 500 futures at 6,000. How many contracts?",o:["30","6","150","3"],a:0,e:"E-mini = $50 \u00d7 6,000 = $300,000. $9,000,000 \u00f7 $300,000 = 30. (Using the $250 full-size contract gives 6.)"},
{c:5,q:"A customer is long the position below. Below what price will a margin call be issued?",l:["Long 2 soybean futures at 11.40","Initial margin $0.40/bu, maintenance margin $0.30/bu"],o:["11.30","11.00","11.10","11.50"],a:0,e:"The cushion between initial and maintenance is 0.10. Long at 11.40 \u2212 0.10 = 11.30."}
);

TF(1,"An FCM that clears all its trades on an omnibus basis with a clearing member will have customer confirmations and statements produced by the clearing member.",0,"False. The clearing member doesn't know whose trades they are, so the introducing (non-clearing) FCM sends its own customers' confirmations and statements."),
TF(1,"Any individual or organisation that intends to transact futures business with the investing public must register with the NFA.",1,"True."),
TF(1,"Registration as a CPO is required for CPOs managing pools with more than $400,000 in total assets.",1,"True. Above $400,000 across all pools, the CPO must register."),
{c:9,q:"An investor who is long October gold could establish a PRODUCT spread by:",o:["Selling December platinum","Buying October silver","Selling September corn","Buying October copper"],a:0,e:"A spread needs a position on the OTHER side in a related product. Long gold + short platinum (a related precious metal) is a product spread. Buying silver just adds another long."},
{c:8,q:"Which outcome is BEST for someone who needs to buy the cash commodity and has a long futures hedge?",o:["Cash price falls and futures price rises","Cash price rises and futures price falls","Both rise by the same amount","Both fall by the same amount"],a:0,e:"They buy the cash commodity cheaper AND profit on their long futures, so their effective purchase price drops."},
TF(8,"If cash corn is 4.70 and nearby futures are 4.82, corn is trading at 12 cents over.",0,"False. 4.70 \u2212 4.82 = \u221212, so it's 12 cents UNDER."),
{c:10,q:"An investor buys the position below. Each contract covers 50,000 pounds. What was the total premium paid?",l:["Long 2 April feeder cattle 300 calls at .05"],o:["$5,000","$2,500","$500","$50,000"],a:0,e:"A premium of .05 means $0.05 per pound (as in the printed book). $0.05 \u00d7 50,000 = $2,500 per contract \u00d7 2 = $5,000."}
);
/* Questions in the style of the official online course question bank (own numbers and wording) */
Q.push(
{c:4,q:"Forward contracts differ from futures contracts in that, with a forward contract:",o:["There is personal contact between the parties","The contract is standardised","Offsetting is easier","Prices are set by open auction"],a:0,e:"Forwards are private deals between two known parties. Futures are standardised, anonymous and priced by open auction on an exchange."},
{c:4,q:"Which statement about futures speculators is INCORRECT?",o:["Most speculators are long-term investors","They assume price risk","They provide liquidity","They never intend to make or take delivery"],a:0,e:"Most speculators are short-term traders profiting from volatility. Watch for 'incorrect' / 'except' in the question."},
{c:4,q:"Lower coffee stocks, rising US incomes and a smaller Colombian coffee crop would be ___ for coffee prices.",o:["Bullish","Bearish","Neutral","Bearish short term, bullish long term"],a:0,e:"Less supply plus more demand (more spending money) pushes prices up: bullish."},
{c:4,q:"When speculating in futures, the degree of risk and the potential profit are:",o:["Directly related","Inversely related","Unrelated","Always equal"],a:0,e:"More risk taken means more profit potential, so they're directly related."},
TF(4,"Marking to market is the daily process of crediting or debiting each account for gains and losses from that day's settlement prices.",1,"True. It's the daily cash-flow system that keeps margin equity at the required level (CFTC glossary)."),
TF(4,"Strategies using combinations of positions, such as spreads, can be as risky as outright long or short positions.",1,"True. A spreader holds two positions, and in some conditions (e.g. a limit market) can lose on both legs. This must be disclosed."),
TF(8,"Basis risk is the risk of an unexpected widening or narrowing of the basis between when a hedge is placed and when it's lifted.",1,"True (NFA glossary definition)."),
TF(8,"A US retailer that must pay a Swiss supplier in Swiss francs should hedge by SELLING Swiss franc futures.",0,"False. Paying foreign currency means you need to buy it, so BUY that currency's futures."),
TF(8,"A miller has agreed to buy oats at a fixed price at harvest and wants protection against falling prices. The miller should buy oats futures.",0,"False. Protection against falling prices = SELL futures."),
TF(8,"An oil refinery that wants protection against a fall in heating oil prices should go short heating oil futures.",1,"True. The refiner will be a SELLER of heating oil once the crude is processed, so it short hedges."),
TF(8,"A hog farmer worried about rising feed costs would put on a short hedge.",0,"False. Worried about RISING costs of something you buy = LONG hedge."),
TF(8,"A cattle farmer who buys corn futures to lock in the cost of feed is treated as a speculator by the CFTC and exchanges.",0,"False. It's a bona fide hedge: the farmer is protecting against a rise in the cost of feed he actually needs."),
TF(8,"A jewellery maker holding an inventory of silver would hedge it with a long position in silver futures.",0,"False. Holding inventory means you fear falling prices, so SELL futures. 'Sellers sell futures to hedge.'"),
TF(2,"An NFA Member may tell clients that some form of futures trading is appropriate for every individual.",0,"False. That statement is prohibited: futures trading is NOT appropriate for everyone because of the risk."),
TF(2,"A registered CPO does not have to keep Daily Purchase and Sale Records, Daily Cash Records or signed Disclosure Document acknowledgments.",0,"False. A CPO must keep all three, current, for five years."),
RN(2,"Which records must a registered CPO keep for five years?",["I. A daily purchase and sale record of each pool transaction","II. A daily cash record of all receipts and disbursements","III. Participants' signed acknowledgments of receiving the Disclosure Document","IV. A copy of each participant's tax return"],["I, II and III","I and II only","II and IV","I, II, III and IV"],"CPOs keep transaction, cash and acknowledgment records. Participants' tax returns aren't required."),
{c:7,q:"A speculator buys 4 stock index futures at 18,250.25 and later sells them at 18,262.75. Assuming a multiplier of $100 \u00d7 the index, what's the result PER CONTRACT?",o:["A gain of $1,250","A loss of $1,250","A gain of $5,000","A loss of $5,000"],a:0,e:"Setup #1: sold 18,262.75 \u2212 bought 18,250.25 = +12.50 points \u00d7 $100 = $1,250 per contract. (\u00d74 = $5,000 in total, but the question asks per contract.)"},
{c:8,q:"A corporate treasurer plans to issue $3,000,000 face of bonds at an assured price and hedges by selling 30 T-bond futures at 98-20 ($100,000 each). The hedge is lifted at 97-08 when the bonds are sold. What does the company take in, including the hedge?",o:["$3,041,250","$2,958,750","$3,001,375","$3,036,000"],a:0,e:"Sold 98-20, bought 97-08 = +1-12 = $1,000 + 12 \u00d7 $31.25 = $1,375 per contract \u00d7 30 = $41,250. $3,000,000 + $41,250 = $3,041,250."},
{c:8,q:"A speculator buys 6 oats contracts (5,000 bu) at $3.80\u00bc and sells at $3.86\u00bd. Commission is $40 per contract and initial margin $1,000 per contract. What's the return on margin and the total profit?",o:["27.25% and $1,635","31.25% and $1,875","23.25% and $1,395","27.25% and $1,875"],a:0,e:"+6\u00bc\u00a2 = 0.0625 \u00d7 5,000 = $312.50 \u2212 $40 = $272.50 per contract. \u00d7 6 = $1,635. $272.50 \u00f7 $1,000 = 27.25%."},
{c:8,q:"A livestock speculator buys 3 lean hog futures (40,000 lb) at 72.40\u00a2 and sells at 76.15\u00a2. Total commissions are $90. Realised profit?",o:["$4,410","$4,500","$1,470","$4,590"],a:0,e:"+3.75\u00a2 = 0.0375 \u00d7 40,000 = $1,500 per contract \u00d7 3 = $4,500 \u2212 $90 TOTAL commission = $4,410."},
{c:8,q:"A client buys 5 frozen orange juice futures (15,000 lb) at 120.50\u00a2 and sells at 131.30\u00a2. Commission is $35 per contract. Profit?",o:["$7,925","$8,100","$1,585","$8,275"],a:0,e:"+10.80\u00a2 = 0.108 \u00d7 15,000 = $1,620 \u00d7 5 = $8,100 gross \u2212 (5 \u00d7 $35 = $175) = $7,925."},
{c:5,q:"A wheat hedger is long 50 futures. The margin requirement on the position is $60,000 and the account has a $95,000 credit balance. Under CBOT hedge margin rules, how much can be withdrawn?",o:["$35,000","$47,500","$95,000","Nothing until the hedge is lifted"],a:0,e:"Anything above the requirement can come out: $95,000 \u2212 $60,000 = $35,000."},
{c:9,q:"Gold futures: Feb 2,410.20, Apr 2,411.00, Jun 2,414.60, Aug 2,414.30, Oct 2,416.00. Which spread would be expected to be MOST profitable?",o:["Buy April, sell June","Sell February, buy April","Buy August, sell October","Sell February, sell October"],a:0,e:"Compare each month with the next: Feb\u2013Apr 0.80, Apr\u2013Jun 3.60, Jun\u2013Aug \u22120.30, Aug\u2013Oct 1.70. The widest (Apr\u2013Jun) is expected to narrow, so buy the near month and sell the far one. Two sells isn't a spread."},
{c:10,q:"An investor who is short a call option closes the position by:",o:["Buying the same call","Selling the same call","Buying the same put","Selling the same put"],a:0,e:"To offset, do the opposite of the opening trade. Sold a call \u2192 buy back the same call."},
{c:9,q:"A speculator buys 10 corn futures at $4.50. He sells 6 at $4.62 and the other 4 at $4.58. Commission is $25 per contract. Net result?",o:["+$4,950","+$5,200","\u2212$4,950","+$5,450"],a:0,e:"6 \u00d7 0.12 = 0.72 and 4 \u00d7 0.08 = 0.32, total 1.04 \u00d7 5,000 = $5,200 \u2212 (10 \u00d7 $25) = $4,950 profit."},
{c:10,q:"A T-bond futures call has a delta of 0.5. Futures move from 110-08 to 112-08. What happens to the option premium?",o:["Up 64/64 (1 full point)","Up 2 full points","Down 64/64","Up 32/64"],a:0,e:"Futures +2.00 \u00d7 0.5 delta = +1 point. Options on T-bond futures trade in 64ths, so 1 point = 64/64."},
{c:8,q:"A packer holding beef sells 3 live cattle futures at $1.8250/lb to hedge. Later it sells the cash cattle at $1.7900 and buys back the futures at $1.7700. Net price received per pound?",o:["$1.8450","$1.7350","$1.7900","$1.8250"],a:0,e:"Setup #2: futures +0.0550 (sold 1.8250, bought 1.7700). Net = cash 1.7900 + 0.0550 = $1.8450."},
{c:9,q:"Soybean futures: Jan 12.10, Mar 12.02, May 11.95, Jul 11.88. What does this suggest about the cash market?",o:["Strong demand and a short cash supply","Little interest and plenty of supply","Large cash supply and strong demand","Prices are too high for any interest"],a:0,e:"Nearby months priced ABOVE deferred months = inverted market = short cash supply, buyers bidding up near-term prices."},
{c:7,q:"A speculator sells 2 T-bond futures at 112-06 and covers at 109-22. Result?",o:["$5,000 gain","$2,500 gain","$5,000 loss","$4,500 gain"],a:0,e:"112-06 \u2212 109-22 = 2-16 = 80/32. 80 \u00d7 $31.25 = $2,500 per contract \u00d7 2 = $5,000 gain."},
{c:7,q:"A trader sells 1 T-bond future at 105-24 and buys it back at 105-02. Margin is $2,000. Result in dollars and as a % of margin?",o:["Gain of $687.50, 34.38%","Loss of $687.50, 34.38%","Gain of $220, 11.00%","Gain of $687.50, 3.44%"],a:0,e:"22/32 \u00d7 $31.25 = $687.50 gain (sold high, bought low). $687.50 \u00f7 $2,000 = 34.38%."},
{c:7,q:"A speculator sells 6 Swiss franc futures (CHF 125,000) at 1.1480 and covers at 1.1325. Result?",o:["$11,625 gain","$1,937.50 gain","$11,625 loss","$1,162.50 gain"],a:0,e:"+0.0155 \u00d7 125,000 = $1,937.50 per contract (each 0.0001 = $12.50) \u00d7 6 = $11,625 gain."},
{c:9,q:"A trader buys 4 Dec oats at $3.40 and sells 4 Dec wheat at $5.90. Later oats are $3.52 and wheat $5.75. Result?",o:["$5,400 gain","$600 gain","$5,400 loss","$1,350 gain"],a:0,e:"Oats +0.12, wheat +0.15 (sold 5.90, bought 5.75) = +0.27 \u00d7 5,000 = $1,350 \u00d7 4 = $5,400 gain."},
{c:7,q:"A business has a floating-rate loan whose rate resets every quarter for the next two years. How can it effectively lock in a fixed rate?",o:["Sell a strip: one short-term interest rate future for each reset quarter","Buy one contract for the first and last quarters only","Buy a strip: one contract for each reset quarter","Sell one contract for the first quarter only"],a:0,e:"It fears RISING rates, and rate futures fall in price when rates rise, so it SELLS. One contract per reset period covers the whole loan."},
{c:10,q:"Corn futures are $4.18\u00bc. A July 4.30 put trades at 12\u215e\u00a2. What's the time value?",o:["1\u215b\u00a2","11\u00be\u00a2","12\u215e\u00a2","\u215e\u00a2"],a:0,e:"Put intrinsic = 4.30 \u2212 4.18\u00bc = 11\u00be\u00a2. Time value = 12\u215e \u2212 11\u00be = 1\u215b\u00a2."},
{c:8,q:"A farmer short hedges 20,000 bu of wheat on Oct 1 (cash 4.10\u00bd, Jan futures 4.24) and lifts the hedge on Nov 15 (cash 4.02, Jan futures 4.12\u00bc). Income per bushel including the hedge?",o:["$4.13\u00be","$4.02","$3.90\u00bc","$4.24"],a:0,e:"Setup #2: futures +0.11\u00be (sold 4.24, bought 4.12\u00bc). Cash 4.02 + 0.11\u00be = $4.13\u00be."},
{c:8,q:"A bank's investment manager holds Treasury bonds and fears rising interest rates will cut their value. To hedge he should:",o:["Sell T-bond futures","Buy T-bond futures","Buy T-bond call options","Buy T-bond futures because yields will rise"],a:0,e:"Rising rates = falling bond prices. A holder fearing falling prices sells futures. Always hedge the PRICE, not the rate."}
);
/* PRO DESK: harder, multi-step questions (d:3) */
const H=o=>Object.assign({a:0,d:3},o);
Q.push(
/* ----- hedging ----- */
H({c:8,q:"A grain elevator short hedges 20,000 bu of wheat with 4 March futures. It pays $30 per contract round turn. What's the net price received per bushel, after commissions?",l:["Open: cash 5.42, sells March futures at 5.68","Close: sells cash wheat at 5.21, buys back futures at 5.40"],o:["$5.484","$5.49","$5.42","$5.214"],e:"Futures +0.28. Cash 5.21 + 0.28 = 5.49. Commissions: 4 \u00d7 $30 = $120 \u00f7 20,000 bu = 0.6\u00a2, so 5.49 \u2212 0.006 = $5.484. Check with the basis: \u221226 \u2192 \u221219 = strengthened 7\u00a2 \u2192 5.42 + 0.07 = 5.49 before costs."}),
H({c:8,q:"A processor puts on the hedge below. What's the net cost of the corn?",l:["Open: cash 4.52, buys Dec futures at 4.70","Close: buys cash corn at 4.95, sells futures at 5.08"],o:["$4.57","$4.47","$5.33","$4.52"],e:"Futures +0.38. Net cost = 4.95 \u2212 0.38 = 4.57. Basis \u221218 \u2192 \u221213 strengthened 5\u00a2, which costs a LONG hedger 5\u00a2: 4.52 + 0.05 = 4.57."}),
H({c:8,q:"A short hedger opens when the basis is 8 over and closes when it's 3 under. What happened?",o:["Basis weakened 11\u00a2: the hedge lost 11\u00a2","Basis strengthened 11\u00a2: the hedge gained 11\u00a2","Basis weakened 5\u00a2: the hedge lost 5\u00a2","Basis strengthened 5\u00a2: the hedge gained 5\u00a2"],e:"+8 \u2192 \u22123: the number went DOWN 11, so the basis weakened 11. Short likes strong, so a weakening basis is a loss of 11\u00a2."}),
H({c:8,rn:1,q:"Which basis moves would BENEFIT a long hedger?",l:["I. 10 under \u2192 15 under","II. 5 over \u2192 2 under","III. 3 under \u2192 6 over","IV. 20 under \u2192 12 under"],o:["I and II","III and IV","I and IV","II and III"],e:"A long hedger wants the basis to WEAKEN (the number goes down). \u221210\u2192\u221215 and +5\u2192\u22122 both go down. III and IV go up (strengthen)."}),
H({c:8,q:"A farmer expects to harvest 52,000 bushels of corn. Hedging with FUTURES, how many contracts should he sell?",o:["10","11","52","5"],e:"With futures, be perfectly or slightly UNDER-hedged. 52,000 \u00f7 5,000 = 10.4 \u2192 10 contracts (11 would be over-hedged, and the excess is speculative)."}),
H({c:10,q:"The same farmer (52,000 bu) hedges with PUT OPTIONS instead. How many puts?",o:["11","10","52","5"],e:"With options it's the opposite: perfectly or slightly OVER-hedged. 10.4 \u2192 11 puts."}),
H({c:7,q:"A US exporter will receive \u20ac500,000 in three months. How should it hedge with euro FX futures (\u20ac125,000 each)?",o:["Sell 4 contracts","Buy 4 contracts","Sell 8 contracts","Buy 2 contracts"],e:"Receiving foreign currency \u2192 sell that currency's futures. \u20ac500,000 \u00f7 \u20ac125,000 = 4."}),
H({c:7,q:"A manager hedges a $12,600,000 stock portfolio with FULL-SIZE S&P 500 futures at 5,600. How many contracts?",o:["9","45","2","18"],e:"Full-size = $250 \u00d7 5,600 = $1,400,000. $12,600,000 \u00f7 $1,400,000 = 9. (45 is the E-mini answer at $50 \u00d7 index.)"}),

/* ----- options ----- */
H({c:10,q:"What's the BREAKEVEN of this position at expiry?",l:["Buy 1 March crude 78 call at 3.10","Sell 1 March crude 82 call at 1.40"],o:["79.70","80.30","83.40","76.30"],e:"Net debit = 3.10 \u2212 1.40 = 1.70. Bull call spread breakeven = lower strike + net debit = 78 + 1.70 = 79.70."}),
H({c:10,q:"What is the MAXIMUM PROFIT on this position?",l:["Buy 1 March crude 78 call at 3.10","Sell 1 March crude 82 call at 1.40"],o:["$2,300","$1,700","$4,000","$5,700"],e:"Max profit = strike difference \u2212 net debit = (82 \u2212 78) \u2212 1.70 = 2.30 \u00d7 1,000 bbl = $2,300. Max loss is the $1,700 debit."}),
H({c:10,q:"Find the breakeven and maximum profit:",l:["Buy 1 Dec corn 460 put at 18","Sell 1 Dec corn 440 put at 9"],o:["Breakeven 451, max profit $550","Breakeven 449, max profit $450","Breakeven 451, max profit $1,000","Breakeven 469, max profit $550"],e:"Debit 9\u00a2. Bear put spread breakeven = higher strike \u2212 debit = 451. Max profit = (460 \u2212 440) \u2212 9 = 11\u00a2 \u00d7 $50 = $550."}),
H({c:10,q:"An investor buys a June gold 2,400 straddle. Where are the breakevens?",l:["Buy 1 June gold 2,400 call at 42","Buy 1 June gold 2,400 put at 38"],o:["2,320 and 2,480","2,358 and 2,442","2,362 and 2,438","2,400 only"],e:"Total premium 80. Breakevens = strike \u00b1 total premium = 2,320 and 2,480."}),
H({c:10,q:"Crude futures are at 88 at expiry. What's the result of the position below?",l:["Sell 1 crude 85 call at 1.20","Sell 1 crude 75 put at 1.00"],o:["\u2212$800","+$2,200","\u2212$3,000","+$800"],e:"The call is 3.00 in the money; the put expires. Premium received 2.20 \u2212 3.00 = \u22120.80 \u00d7 1,000 = \u2212$800."}),
H({c:10,q:"What's the MAXIMUM PROFIT on this covered call?",l:["Long 1 August gold future at 2,380","Short 1 August gold 2,420 call at 25"],o:["$6,500","$2,500","$4,000","$1,500"],e:"Above 2,420 the call caps you. Futures gain 2,420 \u2212 2,380 = 40, plus 25 premium = 65 \u00d7 100 oz = $6,500."}),
H({c:10,q:"Short futures + short put (same strike and expiry) creates a synthetic:",o:["Short call","Long call","Long put","Short future"],e:"Short future + short put = synthetic SHORT call. (Long future + long put = synthetic long call. Short future + long call = synthetic long put.)"}),
H({c:10,q:"A T-bond futures call has a delta of 0.25. Futures move from 114-16 to 116-00. The premium should rise by about:",o:["24/64","12/64","48/64","12/32"],e:"114-16 \u2192 116-00 = +1.5 points. \u00d7 0.25 = 0.375 points. Options trade in 64ths: 0.375 \u00d7 64 = 24/64."}),
H({c:10,q:"Dec soybean futures are 12.05\u00bd. A Dec 11.80 call trades at 34\u00bc\u00a2. What's the TIME value?",o:["8\u00be\u00a2","25\u00bd\u00a2","34\u00bc\u00a2","59\u00be\u00a2"],e:"Call intrinsic = 12.05\u00bd \u2212 11.80 = 25\u00bd\u00a2. Time value = 34\u00bc \u2212 25\u00bd = 8\u00be\u00a2."}),
H({c:10,q:"A trader bought a Sep corn 450 call for 14\u00a2. She exercises with futures at 472 and immediately sells the futures. Net result?",o:["$400 profit","$1,100 profit","$700 loss","$400 loss"],e:"Exercise = long future at 450. Sell at 472 = +22\u00a2, less 14\u00a2 premium = 8\u00a2 \u00d7 $50 = $400."}),
H({c:10,q:"A writer sold a Dec wheat 600 put for 15\u00a2. Futures fall to 570 and she's assigned, then offsets at 570. Result?",o:["\u2212$750","\u2212$1,500","+$750","\u2212$2,250"],e:"Assigned a LONG future at 600, sold at 570 = \u221230\u00a2, plus 15\u00a2 premium = \u221215\u00a2 \u00d7 $50 = \u2212$750."}),

/* ----- spreads & carry ----- */
H({c:9,q:"Result of the spread below?",l:["Buy 3 July soybeans at 12.40, sell 3 Nov soybeans at 12.10","Later: July 12.55, Nov 12.18"],o:["$1,050 gain","$1,050 loss","$3,450 gain","$350 gain"],e:"July +0.15, Nov \u22120.08 = +0.07 \u00d7 5,000 = $350 \u00d7 3 = $1,050 gain."}),
H({c:9,q:"Cash corn is 4.20. Storage is 4\u00a2/month, insurance 0.4\u00a2/month and interest is 6% a year. 3-month futures trade at 4.52. What should an arbitrageur do?",o:["Buy cash corn, store it and sell the futures","Sell cash corn and buy the futures","Buy both cash and futures","Nothing: futures are below full carry"],e:"Interest = 4.20 \u00d7 6% \u00f7 12 = 2.1\u00a2/month. Full carry = (4 + 0.4 + 2.1) \u00d7 3 = 19.5\u00a2 \u2192 4.395. Futures at 4.52 are ABOVE full carry, so buy cash, carry it, sell futures and lock in the gap."}),
H({c:9,q:"Result of the inter-market spread below?",l:["Buy 2 KC Dec wheat at 6.30, sell 2 CBOT Dec wheat at 6.05","Later: KC 6.18, CBOT 5.85"],o:["$800 gain","$800 loss","$3,200 gain","$400 gain"],e:"KC \u22120.12, CBOT +0.20 (sold 6.05, bought 5.85) = +0.08 \u00d7 5,000 = $400 \u00d7 2 = $800 gain."}),
H({c:9,rn:1,q:"Which spreads are CORRECTLY described?",l:["I. Buy March corn / sell May corn: inter-delivery","II. Buy July wheat / sell July corn: inter-market","III. Buy CBOT Dec wheat / sell KC Dec wheat: inter-market","IV. Buy soybeans / sell soybean oil and meal: reverse crush"],o:["I and III","I and II","II and IV","I, III and IV"],e:"II is INTER-COMMODITY (different commodities). IV is a regular CRUSH; a reverse crush sells soybeans and buys the products."}),

/* ----- margin & accounts ----- */
H({c:5,q:"A customer deposits $6,000 initial margin for 2 contracts (maintenance $2,250 each). The position loses $1,800. What happens?",o:["A $1,800 margin call","A $300 margin call","A $4,500 margin call","No margin call"],e:"Equity = $4,200, below the $4,500 maintenance. The call restores the account to INITIAL ($6,000), so $1,800 is due."}),
H({c:5,q:"Same account ($6,000 initial, $4,500 maintenance for 2 contracts) loses $1,200 instead. What happens?",o:["No margin call","A $1,200 margin call","A $300 margin call","The position is liquidated"],e:"Equity = $4,800, still ABOVE $4,500 maintenance, so there's no call yet."}),
H({c:5,q:"At the CME, a customer posts $20,000 of stock plus $2,000 cash. The margin requirement is $15,000. What's the excess (or deficit)?",o:["$1,000 excess","$7,000 excess","$1,000 deficit","$6,000 deficit"],e:"Stock counts at 70% (30% haircut): $14,000 + $2,000 cash = $16,000 \u2212 $15,000 = $1,000 excess."}),
H({c:5,q:"Account equity is $11,500. Open positions need $8,000 initial ($6,000 maintenance). A new trade needs $3,000 initial. Can it be margined from the account?",o:["Yes, leaving $500 above initial","No, it's $1,500 short","Yes, leaving $2,500 spare","No, equity must be double the requirement"],e:"Only equity above INITIAL counts toward new positions: $11,500 \u2212 $8,000 = $3,500 \u2265 $3,000, leaving $500. (Using maintenance gives the trap answer of $2,500.)"}),

// Turns a bank question into a playable item; may convert MCQ to true/false like the real exam
function makeItem(q,tfChance){
  if(q.tf)return{q,tf:true,proposal:null,opts:["True","False"],ans:q.a};
  if(false){
    const showRight=Math.random()<.5;
    const wrongs=q.o.filter((_,i)=>i!==q.a);
    const shown=showRight?q.o[q.a]:wrongs[Math.random()*wrongs.length|0];
    return{q,tf:true,chk:true,proposal:shown,opts:["True","False"],ans:showRight?0:1};
  }
  const order=shuffle(q.o.map((t,i)=>i));
  return{q,tf:false,opts:order.map(i=>q.o[i]),ans:order.indexOf(q.a)};
}
function pickFor(chs,n,used){
  const pool=Q.filter(q=>chs.includes(q.c)&&!used.has(q.id));
  // weight: unseen and previously-missed questions come up first
  const w=q=>{const s=S.seen[q.id];if(!s)return 2+Math.random();return (s.w>s.r?1.5:0)+Math.random()};
  const out=pool.map(q=>[w(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
  out.forEach(q=>used.add(q.id));return shuffle(out);
}

/* ---------- desk shift ---------- */
function deskIntro(c){
  const d=DESKS[c-1],b=S.best[c];
  modal(`<div class="lbl">Desk ${c}</div><h2>${d.name}</h2><p>${d.sub}</p>
  <p style="margin-top:12px;text-align:left">&#9656; 10 questions, $10,000 starting account<br>&#9656; Right answers make money. Streaks raise your multiplier, up to x3<br>&#9656; Each wrong answer is a <b style="color:var(--red)">margin call</b>. You get 3. The 4th liquidates you<br>&#9656; Score 70%+ to clear the desk${c<10?" and unlock the next":""}</p>

function startDesk(c){
  const items=pickFor([c],10,new Set()).map(q=>makeItem(q,.25));
  R={mode:"desk",c,items,i:0,right:0,wrong:0,bal:10000,streak:0,lives:3,misses:[],t0:0,done:false,liq:false,hist:[10000]};

}
function startDamage(){
  const ids=Object.keys(S.missed).filter(id=>byId[id]);
  if(!ids.length){modal(`<h2>Clean book</h2><p>Nothing to review yet. Questions you miss anywhere in the game land here until you've answered them right twice in a row.</p><button class="next" onclick="closeModal()">OK</button>`);return}
  const items=shuffle(ids).slice(0,15).map(id=>makeItem(byId[id],.2));
  R={mode:"damage",items,i:0,right:0,wrong:0,bal:0,streak:0,lives:99,misses:[],cleared:0};

function mult(){const s=R.streak;return s>=6?3:s>=4?2:s>=2?1.5:1}

function play(){
  window.scrollTo(0,0);
  const it=R.items[R.i],n=R.items.length,q=it.q,d=DESKS[q.c-1];
  R.t0=Date.now();R.answered=null;
  let chips="";
  if(R.mode==="desk")chips=`<div class="chips"><span class="chip">ACCT <b id="bal" class="${R.bal>=10000?"pos":"neg"}">${money(R.bal)}</b></span><span class="chip">STREAK <b>${R.streak}</b> &middot; x${mult()}</span><span class="chip lives">${"&#9679;".repeat(Math.max(R.lives,0))}${"&#9675;".repeat(3-Math.max(R.lives,0))}</span></div>`;
  if(R.mode==="pro")chips=`<div class="chips"><span class="chip" style="color:var(--amber);border-color:var(--amberD)">PRO DESK</span><span class="chip">Right <b>${R.right}</b>/${R.i}</span></div>`;
  if(R.mode==="daily")chips=`<div class="chips"><span class="chip">DAILY DRILL</span><span class="chip">Streak <b>${S.daily.streak||0}</b></span></div>`;
  if(R.mode==="damage")chips=`<div class="chips"><span class="chip">DAMAGE CONTROL</span><span class="chip">Cleared <b>${R.cleared}</b></span></div>`;
  if(R.mode==="mock")chips=`<div class="chips"><span class="chip">PART <b>${it.part}</b></span><span class="chip">&#9201; <b id="clock">${fmtClock()}</b></span><span class="chip">Answered <b>${R.i}</b>/${n}</span></div>`;
  if(R.mode==="outcry")chips=`<div class="chips"><span class="chip">&#9201; <b id="clock">${Math.max(0,Math.ceil((R.end-Date.now())/1000))}s</b></span><span class="chip">SCORE <b id="score">${R.score}</b></span><span class="chip">COMBO <b>x${Math.min(1+R.streak,5)}</b></span></div>`;
  const keys=it.tf?["T","F"]:["a","b","c","d"];
  $("#app").innerHTML=`<div class="hud"><button class="quit" onclick="quitAsk()">&#10005;</button><div class="prog"><i style="width:${100*R.i/n}%"></i></div><div class="hudr">${R.mode==="outcry"?"#"+(R.i+1):(R.i+1)+"/"+n}</div></div>
  ${chips}
  <div class="qcard"><div class="qmeta"><span>CH ${q.c} &middot; ${d.name.toUpperCase()}${q.d===3?` &middot; <b style="color:var(--amber)">PRO</b>`:""}</span><span>${it.tf?"TRUE / FALSE":"MULTIPLE CHOICE"}</span></div>
   <div class="qtext">${esc(it.proposal!=null?q.q.replace(/^TRUE or FALSE:\s*/,""):q.q.replace(/^TRUE or FALSE:\s*/,""))}</div>
   ${q.l?`<div class="posbox">${q.l.map(x=>x?`<div class="${/^[IV]+\./.test(x)?"rnl":""}">${esc(x)}</div>`:`<div style="height:6px"></div>`).join("")}</div>`:""}
   ${it.proposal!=null?`<div class="proposal"><span class="lbl">True or false: the answer is\u2026</span>${esc(it.proposal)}</div>`:""}
   <div class="opts ${it.tf?"tfrow":""}">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})">${it.tf?"":`<span class="key">${keys[i]}</span>`}<span>${esc(o)}</span></button>`).join("")}</div>
  </div><div id="fbx"></div>`;
}
function fmtClock(){const s=Math.max(0,Math.round((R.end-Date.now())/1000));const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}

function answer(i){
  if(!R||R.answered!=null)return;
  const it=R.items[R.i],ok=i===it.ans;R.answered=i;
  record(it.q,ok);
  if(R.mode==="mock"){it.chosen=i;it.ok=ok;R.i++;save();R.i>=R.items.length?finishMock():play();return}
  const btns=[...document.querySelectorAll(".opt")];btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(ok?"ok":"bad");if(!ok)btns[it.ans].classList.add("ok");
  beep(ok);buzz(ok);cardFx(ok);
  if(!ok)R.misses.push({it,chosen:i});
  if(R.mode==="outcry"){
    if(ok){R.streak++;const pts=Math.min(R.streak,5);R.score+=pts;floatTxt("+"+pts,"var(--green)")}else{R.streak=0;floatTxt("\u2715","var(--red)")}
    R.right+=ok?1:0;R.i++;
    if(R.i>=R.items.length)R.items.push(...pickFor(R.chs,20,R.used).map(q=>makeItem(q,.3)));
    setTimeout(()=>{if(R&&R.mode==="outcry"&&!R.done)play()},ok?350:900);return;
  }
  let delta=0,title;
  if(ok){R.right++;
    if(R.mode==="desk"){R.streak++;const sec=(Date.now()-R.t0)/1000;delta=Math.round(400*mult()+(sec<12?100:0));R.bal+=delta}
    if(S.missed[it.q.id]!=null&&R.mode!=="desk"){S.missed[it.q.id]++;if(S.missed[it.q.id]>=2){delete S.missed[it.q.id];R.cleared++}}
    title=["Filled.","Nice trade.","Correct.","On the money.","Locked in."][Math.random()*5|0];
  }else{R.wrong++;
    if(R.mode==="desk"){R.streak=0;delta=-1500;R.bal+=delta;R.lives--;
      if(R.lives<0){R.liq=true;flash("Liquidated","var(--red)")}else flash("Margin call","var(--red)")}
    title=["Not quite.","Missed that one.","Close, but no."][Math.random()*3|0];
  }
  save();
  const correct=it.q.o[it.q.a];
  const ex=(it.proposal!=null?`Correct answer: <b>${esc(correct)}</b>. `:"")+esc(it.q.e);
  const last=R.i>=R.items.length-1||R.liq;
  $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><h5><span>${title}</span>${R.mode==="desk"?`<span class="delta ${delta>=0?"pos":"neg"}">${smoney(delta)}</span>`:""}</h5><p>${ex}</p></div>
   <button class="next" id="nextb" onclick="nextQ()">${R.liq?"See the damage":last?"Close the shift":"Next &rarr;"}</button>`;
  if(R.mode==="desk"){R.hist.push(R.bal);const b=$("#bal");if(b){b.className=R.bal>=10000?"pos":"neg";tickNum(b,R.bal-delta,R.bal,money)}}
  setTimeout(()=>{const n=$("#nextb");n&&n.scrollIntoView({behavior:"smooth",block:"nearest"})},50);
}
function nextQ(){if(R.liq||R.i>=R.items.length-1)return finishRun();R.i++;play()}
function flash(t,c){const e=document.createElement("div");e.className="toast";e.textContent=t;e.style.background=c;document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
function buzz(ok){try{navigator.vibrate&&navigator.vibrate(ok?15:[60,40,90])}catch(e){}}
function cardFx(ok){const c=$(".qcard");if(!c)return;c.classList.remove("pulse","shake");void c.offsetWidth;c.classList.add(ok?"pulse":"shake")}
function tickNum(el,from,to,fmt){if(!el)return;const t0=performance.now(),d=550;el.classList.remove("tick-up","tick-dn");void el.offsetWidth;el.classList.add(to>=from?"tick-up":"tick-dn");
  (function f(n){const k=Math.min(1,(n-t0)/d),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function countUp(el,to,suf){if(!el)return;const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/700),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(f)})(t0)}
function floatTxt(t,c){const e=document.createElement("div");e.className="float";e.textContent=t;e.style.color=c;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
function quitAsk(){modal(`<h2>Leave the floor?</h2><p>${R&&R.mode==="mock"?"Your mock exam will be abandoned.":"This run won't count, but anything you got wrong is still saved to Damage Control."}</p><div class="row" style="margin-top:16px"><button class="next ghost" onclick="closeModal()">Stay</button><button class="next" onclick="closeModal();home()">Leave</button></div>`)}

function pnlChart(hs){
  const W=330,H=130,L=44,Rr=8,T=10,B=20,n=hs.length;
  const lo=Math.min(...hs,10000),hi=Math.max(...hs,10000),pad=Math.max(500,(hi-lo)*.12),a=lo-pad,b=hi+pad;
  const x=i=>L+(W-L-Rr)*(n>1?i/(n-1):0),y=v=>T+(H-T-B)*(1-(v-a)/(b-a));
  const up=hs[n-1]>=10000,col=up?"#22d37a":"#ff4d5e";
  const pts=hs.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" class="spark"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".28"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>`;
  [a+pad,b-pad,10000].forEach(v=>{s+=`<text x="${L-6}" y="${y(v)+3}" text-anchor="end" class="ax">${(v/1000).toFixed(1)}k</text>`});
  s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(10000)}" y2="${y(10000)}" stroke="#3a4556" stroke-dasharray="3 4"/>`;
  s+=`<polygon points="${x(0)},${H-B} ${pts} ${x(n-1)},${H-B}" fill="url(#gf)" style="opacity:0;animation:fadein .6s .9s forwards"/>`;
  s+=`<polyline points="${pts}" class="ln" stroke="${col}"/>`;
  hs.forEach((v,i)=>{if(!i)return;const c=v>=hs[i-1]?"#22d37a":"#ff4d5e";s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${c}" class="dot" style="animation-delay:${.2+i*.1}s"/><text x="${x(i)}" y="${H-5}" text-anchor="middle" class="ax">${i}</text>`});
  return s+"</svg>";
}
function missList(ms){
  if(!ms.length)return "";
  return `<div class="sect">Your misses <span class="lbl">sent to Damage Control</span></div><div class="card">`+ms.map(m=>{const q=m.it.q;
    const your=m.it.proposal!=null?`You said ${m.chosen===0?"True":"False"} to "${m.it.proposal}"`:`You said: ${m.it.opts[m.chosen]}`;
    return `<div class="miss"><q>${esc(q.q.replace(/^TRUE or FALSE:\s*/,""))}</q>${q.l?`<div class="e" style="font-family:var(--mono);font-size:12px">${q.l.filter(Boolean).map(esc).join("<br>")}</div>`:""}<div class="y">\u2715 ${esc(your)}</div><div class="a">\u2713 ${esc(q.o[q.a])}</div><div class="e">${esc(q.e)}</div></div>`}).join("")+`</div>`;
}

function finishRun(){
  stopTimer();R.answered=-1;window.scrollTo(0,0);
  const m=R.mode;let h="";
  if(m==="desk"){
    const pct=Math.round(100*R.right/R.items.length);
    const pass=!R.liq&&pct>=70,pnl=R.bal-10000;
    const st=pass?(pct>=100?3:pct>=85?2:1):0;
    const before=rankIdx(),wasCleared=!!S.cleared[R.c];
    S.pnl+=pnl;if(!R.liq)S.best[R.c]=Math.max(S.best[R.c]||0,pct);if(pass)S.cleared[R.c]=true;save();
    const promoted=pass&&!wasCleared&&rankIdx()>before;
    h=`<div class="res-head"><div class="lbl">Desk ${R.c} &middot; ${DESKS[R.c-1].name}</div>
     <div class="verdict ${pass?"pos":"neg"}" style="margin-top:8px">${R.liq?"Liquidated":pass?"Desk cleared":"Shift failed"}</div>
     <div class="stars">${[1,2,3].map(i=>`<span class="${i<=st?"":"off"}">&#9733;</span>`).join("")}</div>
     <div class="big" id="bigpct">0%</div><div class="lbl" style="margin-top:6px">${R.right}/${R.items.length} correct &middot; need 70%</div></div>
     <div class="card" style="padding:12px 10px 6px"><div class="lbl" style="padding:0 4px">Your account, question by question</div>${pnlChart(R.hist)}</div>
     <div class="stats" style="margin-top:10px"><div class="stat"><div class="lbl">Shift P&amp;L</div><div class="v ${pnl>=0?"pos":"neg"}">${smoney(pnl)}</div></div>
     <div class="stat"><div class="lbl">Closing acct</div><div class="v">${money(R.bal)}</div></div>
     <div class="stat"><div class="lbl">Mastery</div><div class="v">${mastery(R.c)}%</div></div></div>
     <div class="row" style="margin-top:14px"><button class="next ghost" onclick="home()">Floor</button><button class="next" onclick="startDesk(${R.c})">Run it again</button></div>
     ${pass&&R.c<10?`<button class="next ghost" onclick="deskIntro(${R.c+1})">Next desk &rarr; ${DESKS[R.c].name}</button>`:""}
     ${missList(R.misses)}`;
    $("#app").innerHTML=h;countUp($("#bigpct"),pct,"%");
    if(promoted)setTimeout(()=>{beep(true);modal(`<div class="lbl">Promotion</div><div class="rankchip" style="margin:12px auto;width:70px;height:70px;font-size:24px">${RANKCODE[rankIdx()]}</div><h2>${RANKS[rankIdx()]}</h2><p>${rankIdx()>=10?"Every desk cleared. Now beat the Final Boss: a full mock exam with 70%+ in both parts.":"New desk unlocked: <b>"+DESKS[R.c].name+"</b>."}</p><button class="next" onclick="closeModal()">Back to work</button>`)},400);
    return;
  }
  if(m==="pro"){
    const pct=Math.round(100*R.right/R.items.length);const best=S.proBest==null||pct>S.proBest;if(best){S.proBest=pct;save()}
    h=`<div class="res-head"><div class="lbl">Pro Desk</div><div class="big" id="bigpct">0%</div>
     <div class="verdict ${pct>=70?"pos":"neg"}" style="font-size:18px;margin-top:8px">${pct>=85?"Exam ready on the hard stuff":pct>=70?"Pass standard":"More work needed"}</div>
     <div class="lbl" style="margin-top:6px">${R.right}/${R.items.length} right${best?" &middot; new best":""}</div></div>
     <div class="row"><button class="next ghost" onclick="home()">Floor</button><button class="next" onclick="startPro()">Another 12</button></div>${missList(R.misses)}`;
    $("#app").innerHTML=h;countUp($("#bigpct"),pct,"%");return;
  }
  if(m==="daily"){
    const inc=markDaily();
    h=`<div class="res-head"><div class="lbl">Daily drill</div><div class="big">${R.right}/${R.items.length}</div>
     <div class="verdict pos" style="font-size:18px;margin-top:8px">${inc?"Streak: "+S.daily.streak+" day"+(S.daily.streak>1?"s":""):"Bonus round done"}</div>
     <div class="lbl" style="margin-top:6px">${daysLeft()} days to exam</div></div>
     <div class="row"><button class="next ghost" onclick="home()">Floor</button><button class="next" onclick="startDaily()">Another 10</button></div>${missList(R.misses)}`;
    $("#app").innerHTML=h;return;
  }
  if(m==="damage"){
    const left=Object.keys(S.missed).filter(id=>byId[id]).length;
    h=`<div class="res-head"><div class="lbl">Damage Control</div><div class="big">${R.right}/${R.items.length}</div>
     <div class="lbl" style="margin-top:6px">${R.cleared} cleared &middot; ${left} still on the list</div></div>
     <div class="row"><button class="next ghost" onclick="home()">Floor</button>${left?`<button class="next" onclick="startDamage()">Another round</button>`:""}</div>${missList(R.misses)}`;

function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function daysLeft(){const t=parseD(todayStr());return Math.round((parseD(S.examDate)-t)/86400000)}
function mockStreak(){let n=0;for(let i=S.mocks.length-1;i>=0&&S.mocks[i];i--)n++;return n}
function isWknd(d){const w=d.getDay();return w===0||w===6}
function wDays(from,to){let w=0;const d=new Date(from);while(d<=to){w+=isWknd(d)?1:.4;d.setDate(d.getDate()+1)}return w}
function plan(){
  const dl=daysLeft(),cc=clearedCount(),today=parseD(todayStr()),wk=isWknd(today);
  const exam=parseD(S.examDate),learnEnd=new Date(exam);learnEnd.setDate(learnEnd.getDate()-11);
  const start=parseD(S.planStart||"2026-11-16");
  const slot=wk?"<b>Weekend:</b> bigger session":"<b>Workday:</b> short breaks only";
  const lm=S.lastMock;
  const mockVerdict=()=>{
    if(cc<10)return{st:"more",why:`${10-cc} desk${10-cc>1?"s":""} still to clear before mocks count.`};
    if(!lm)return{st:"more",why:"No mock sat yet: you need one to know where you stand."};
    const pass=lm.p1>=70&&lm.p2>=70;
    if(pass&&mockStreak()>=2)return{st:"ahead",why:`Last mock passed (P1 ${lm.p1}%, P2 ${lm.p2}%) and ${mockStreak()} full passes in a row.`};
    if(pass)return{st:"on",why:`Last mock passed: P1 ${lm.p1}%, P2 ${lm.p2}%. One more full pass and you're ready.`};
    const weak=lm.p2<70&&lm.p1<70?"both parts":lm.p2<70?"Part 2 (rules)":"Part 1 (markets)";
    return{st:"more",why:`Last mock: P1 ${lm.p1}%, P2 ${lm.p2}%. ${weak} below 70%.`};
  };
  if(dl<0)return{head:"Exam done",st:null,txt:"How did it go? Set a new date in Settings if there's a resit.",act:null};
  if(dl===0)return{head:"Exam day",st:null,txt:"No new material today. Skim the Cheat Sheet and trust the work.",act:["Cheat Sheet","cheat()"]};
  if(dl<=2){const v=mockVerdict();return{head:"Taper",...v,txt:"Light work only: Cheat Sheet, Contract Match and Damage Control. Early night.",act:["Cheat Sheet","cheat()"]}}
  if(dl<=10){const v=mockVerdict();
    if(cc<10)return{head:"Exam practice",...v,txt:`${slot}. Finish the last desks first: turn on <b>Unlock all desks</b> in Settings and go straight to your gaps.`,act:["Open the floor",""]};
    return wk?{head:"Mock day",...v,txt:`${slot}. Sit a <b>full mock</b> (2h30), then work through every miss in Damage Control.`,act:["Full mock","startMock(1)"]}
             :{head:"Repair day",...v,txt:`${slot}. Daily drill + Damage Control in your gaps. Mini mock (50 min) if you get a free lunch hour.`,act:["Damage Control","startDamage()"]};
  }
  const tot=wDays(start,learnEnd),yest=new Date(today);yest.setDate(yest.getDate()-1);
  const tgt=d=>Math.max(0,Math.min(10,Math.floor(10*wDays(start,d)/tot+1e-9)));
  const tToday=Math.max(1,tgt(today)),tYest=tgt(yest);
  let st,why;
  if(cc>tToday){st="ahead";why=`${cc} desks cleared: ahead of today's target of ${tToday}.`}
  else if(cc>=tYest){st="on";why=cc>=tToday?`Today's target of ${tToday} desk${tToday>1?"s":""} done.`:`On pace: get to ${tToday} desk${tToday>1?"s":""} by tonight.`}
  else{st="more";why=`${cc} cleared vs a target of ${tToday}. Catch up ${wk?"this weekend":"over the next few breaks"}.`}
  const nextDesk=DESKS.find(d=>!S.cleared[d.c]);
  const todo=wk?"2 desk shifts + the daily drill":"the daily drill + one desk shift (about 15 min in total)";
  return{head:"Learning phase",st,why,txt:`${slot}. Today: ${todo}. Mocks start ${learnEnd.getDate()+1} ${learnEnd.toLocaleDateString("en-GB",{month:"short"})}.`,act:nextDesk?["Desk "+nextDesk.c+": "+nextDesk.name,`deskIntro(${nextDesk.c})`]:null};
}

/* ---------- order desk game ---------- */
const ORDER_SETS=[
 {name:"Dec Corn",unit:"\u00a2",lo:380,hi:520,step:1},
 {name:"Crude Oil",unit:"$",lo:62,hi:88,step:.25},
 {name:"Gold",unit:"$",lo:1900,hi:2500,step:5}
];
const SCEN=[
 {k:"BL",side:-1,t:"You want to <b>buy</b>, but only if the price dips to <b>{p}</b>. You'll take that price or better."},
 {k:"SL",side:1,t:"You want to <b>sell</b>, but only if the price rallies to <b>{p}</b>. You'll take that price or better."},
 {k:"SS",side:-1,t:"You're <b>long</b>. Protect yourself: get out if the market falls to <b>{p}</b>."},
 {k:"BS",side:1,t:"You're <b>short</b>. Limit the damage: get out if the market climbs to <b>{p}</b>."},
 {k:"BS",side:1,t:"Resistance sits just under <b>{p}</b>. If the market breaks through, you want to <b>get long</b> straight away."},
 {k:"SS",side:-1,t:"Support sits just above <b>{p}</b>. If the market breaks down through it, you want to <b>get short</b> straight away."},
 {k:"SL",side:1,t:"You're <b>long</b> and want to <b>take profit</b> at <b>{p}</b>."},
 {k:"BL",side:-1,t:"You're <b>short</b> and want to <b>take profit</b> by covering at <b>{p}</b>."},
 {k:"BM",side:-1,t:"You want to <b>buy</b> as soon as the market touches <b>{p}</b>. Once it's touched you want a fill at any price, even slightly worse."},
 {k:"SM",side:1,t:"You want to <b>sell</b> as soon as the market touches <b>{p}</b>. Once it's touched you want a fill at any price, even slightly worse."},
 {k:"SSL",side:-1,t:"You're <b>long</b>. Get out if it falls to <b>{p}</b>, but you refuse to be filled more than a little below that."},
 {k:"BSL",side:1,t:"You're <b>short</b>. Get out if it rises to <b>{p}</b>, but you refuse to be filled more than a little above that."}
];
const OT={BL:"Buy Limit",SL:"Sell Limit",BS:"Buy Stop",SS:"Sell Stop",BM:"Buy MIT",SM:"Sell MIT",BSL:"Buy Stop Limit",SSL:"Sell Stop Limit"};
const OWHY={
 BL:"Buy Limit sits BELOW the market and fills at the limit or lower. It's a better price you're waiting for.",
 SL:"Sell Limit sits ABOVE the market and fills at the limit or higher.",
 BS:"Buy Stop sits ABOVE the market. Once hit it becomes a market order, so it's used to protect a short or to buy a breakout.",
 SS:"Sell Stop sits BELOW the market. Once hit it becomes a market order, so it's used to protect a long or to sell a breakdown.",
 BM:"Buy MIT sits where a buy limit would (below the market), but once touched it becomes a MARKET order, so it fills at any price.",
 SM:"Sell MIT sits where a sell limit would (above the market), but once touched it becomes a MARKET order.",
 BSL:"Buy Stop Limit: the stop triggers above the market, then it becomes a LIMIT order, so you won't pay above your limit (but you might not get filled).",
 SSL:"Sell Stop Limit: the stop triggers below the market, then it becomes a LIMIT order, so you won't sell below your limit (but you might not get filled)."
};
function fmtP(set,v){return set.unit==="\u00a2"?v+"\u00a2":"$"+(set.step<1?v.toFixed(2):v.toLocaleString("en-US"))}
function makeOrderRound(){
  const set=ORDER_SETS[Math.random()*ORDER_SETS.length|0],sc=SCEN[Math.random()*SCEN.length|0];
  const span=(set.hi-set.lo);let mkt=set.lo+Math.round(Math.random()*span/set.step/2+span/set.step/4)*set.step;
  const gap=set.step*(set.step<1?Math.round(4+Math.random()*12):set.step===5?Math.round(3+Math.random()*6):Math.round(5+Math.random()*15));
  const p=+(mkt+sc.side*gap).toFixed(2);
  // distractors: always the mirror-side order of same type, the opposite type on the same side, plus one more
  const pool=Object.keys(OT).filter(k=>k!==sc.k);
  const mirror={BL:"SL",SL:"BL",BS:"SS",SS:"BS",BM:"SM",SM:"BM",BSL:"SSL",SSL:"BSL"}[sc.k];
  const swap={BL:"BS",BS:"BL",SL:"SS",SS:"SL",BM:"BS",SM:"SS",BSL:"BS",SSL:"SS"}[sc.k];
  const extra={BM:"BL",SM:"SL",BSL:"BS",SSL:"SS"}[sc.k];
  let ds=[mirror,swap];if(extra&&!ds.includes(extra))ds.push(extra);
  shuffle(pool).forEach(k=>{if(ds.length<3&&!ds.includes(k)&&!(["BL","SL"].includes(sc.k)&&k===(sc.k==="BL"?"BM":"SM")))ds.push(k)});
  const opts=shuffle([sc.k,...ds.slice(0,3)]);
  return{set,sc,mkt,p,opts,ans:opts.indexOf(sc.k)};
}
function ladderSVG(o,placed){
  const set=o.set,range=Math.max(Math.abs(o.p-o.mkt)*1.8,set.step*10);
  const top=o.mkt+range,bot=o.mkt-range,H=230,W=320,y=v=>14+(top-v)/(top-bot)*(H-28);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ladder"><rect x="0" y="0" width="${W}" height="${y(o.mkt)}" fill="#0f1a12"/><rect x="0" y="${y(o.mkt)}" width="${W}" height="${H-y(o.mkt)}" fill="#1a0f12"/>
   <text x="${W-8}" y="22" text-anchor="end" class="zl" fill="#2f8f5c">ABOVE MARKET</text><text x="${W-8}" y="${H-10}" text-anchor="end" class="zl" fill="#a33a48">BELOW MARKET</text>`;
  for(let i=0;i<=8;i++){const v=bot+(top-bot)*i/8;s+=`<line x1="54" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#1f2733"/><text x="48" y="${y(v)+4}" text-anchor="end" class="tk">${fmtP(set,+(Math.round(v/set.step)*set.step).toFixed(2))}</text>`}
  s+=`<line x1="54" x2="${W}" y1="${y(o.mkt)}" y2="${y(o.mkt)}" stroke="#ffb000" stroke-width="2.5"/><rect x="60" y="${y(o.mkt)-11}" width="98" height="22" rx="4" fill="#ffb000"/><text x="109" y="${y(o.mkt)+4}" text-anchor="middle" class="mk">MKT ${fmtP(set,o.mkt)}</text>`;
  s+=`<line x1="54" x2="${W}" y1="${y(o.p)}" y2="${y(o.p)}" stroke="#4da3ff" stroke-width="2" stroke-dasharray="6 5"/><circle cx="180" cy="${y(o.p)}" r="5" fill="#4da3ff"/><text x="62" y="${y(o.p)+(o.p>o.mkt?-8:18)}" class="tg">${fmtP(set,o.p)}</text>`;
  if(placed!=null){const ok=placed===o.sc.k;s+=`<g class="pl"><rect x="200" y="${y(o.p)-12}" width="112" height="24" rx="5" fill="${ok?"#22d37a":"#ff4d5e"}"/><text x="256" y="${y(o.p)+4}" text-anchor="middle" class="mk">${OT[placed].toUpperCase()}</text></g>`}
  return s+"</svg>";
}
function startOrders(){R={mode:"orders",rounds:Array.from({length:10},makeOrderRound),i:0,right:0,score:0,streak:0,misses:[]};playOrder()}
function playOrder(){
  window.scrollTo(0,0);const o=R.rounds[R.i];R.answered=null;R.t0=Date.now();

function answerOrder(i){

  const where=o.p>o.mkt?"above":"below";
  $("#fbx").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><h5><span>${ok?"Ticket accepted.":"Ticket rejected."}</span><span class="delta ${ok?"pos":"neg"}">${ok?"+"+pts:"0"}</span></h5>
   <p>${ok?"":`You picked <b>${OT[k]}</b>. `}Your price is <b>${where}</b> the market. ${OWHY[o.sc.k]}</p>
   <p style="color:var(--amber);font:600 12px var(--mono)">BL/SS BELOW &middot; SL/BS ABOVE</p></div>
   <button class="next" id="nextb" onclick="nextOrder()">${R.i>=9?"Close the desk":"Next ticket &rarr;"}</button>`;
  setTimeout(()=>{const n=$("#nextb");n&&n.scrollIntoView({behavior:"smooth",block:"nearest"})},50);
}
function nextOrder(){if(R.i>=9)return finishOrders();R.i++;playOrder()}
function finishOrders(){
  R.answered=-1;window.scrollTo(0,0);const best=R.score>(S.orderBest||0);if(best){S.orderBest=R.score;save()}
  $("#app").innerHTML=`<div class="res-head"><div class="lbl">Order Desk</div><div class="big">${R.score}</div>
  <div class="verdict ${best?"pos":""}" style="font-size:18px;margin-top:8px">${best?"New personal best":"Best: "+S.orderBest}</div><div class="lbl" style="margin-top:6px">${R.right}/10 tickets right</div></div>
  <div class="row"><button class="next ghost" onclick="home()">Floor</button><button class="next" onclick="startOrders()">Again</button></div>
  ${R.misses.length?`<div class="sect">Rejected tickets</div><div class="card">`+R.misses.map(m=>`<div class="miss"><q>${m.o.sc.t.replace(/<\/?b>/g,"").replace("{p}",fmtP(m.o.set,m.o.p))}</q><div class="y">\u2715 ${OT[m.k]}</div><div class="a">\u2713 ${OT[m.o.sc.k]}</div><div class="e">${OWHY[m.o.sc.k]}</div></div>`).join("")+`</div>`:""}`;
}

/* ---------- contract match game ---------- */
const DECKS={
 sizes:{name:"Contract sizes",items:[["Corn","5,000 bu"],["Coffee","37,500 lb"],["Sugar","112,000 lb"],["Orange juice","15,000 lb"],["Live cattle","40,000 lb"],["Feeder cattle","50,000 lb"],["Class III milk","200,000 lb"],["Gold","100 troy oz"],["Silver","5,000 troy oz"],["Copper","25,000 lb"],["Crude oil","1,000 bbl"],["Heating oil","42,000 gal"],["British pound","\u00a362,500"],["Canadian dollar","C$100,000"],["Swiss franc","CHF 125,000"],["Japanese yen","\u00a512,500,000"],["T-bond","$100,000"],["3-month T-bill","$1,000,000"],["E-mini S&P 500","$50 \u00d7 index"],["S&P 500 (full)","$250 \u00d7 index"],["E-mini Dow","$5 \u00d7 index"],["E-mini Nasdaq-100","$20 \u00d7 index"]]},
 ticks:{name:"Tick & point values",items:[["Grains: 1\u00a2","$50"],["T-bond future: 1/32","$31.25"],["T-bond option: 1/64","$15.625"],["3-month T-bill / SOFR: 1 bp","$25"],["12-month T-bill: 1 bp","$100"],["T-bond future: 1 full point","$1,000"],["Gold: $1/oz move","$100"],["Crude: $1/bbl move","$1,000"],["Gold option: 1 point","$100 "],["Sugar option: 1 point","$1,120"],["E-mini S&P option: 1 point","$50 "],["Silver: $1/oz move","$5,000"]]}
};
function startMatch(deck){
  const d=DECKS[deck];R={mode:"match",deck,round:0,rounds:3,errors:0,t0:Date.now(),missed:{},sel:null,done:0};
  R.queue=shuffle(d.items);matchRound();
  timerId=setInterval(()=>{const c=$("#clock");if(c)c.textContent=((Date.now()-R.t0)/1000+R.errors*5).toFixed(1)+"s"},100);
}
function matchRound(){
  window.scrollTo(0,0);
  let pool=R.queue.splice(0,6);if(pool.length<6){R.queue=shuffle(DECKS[R.deck].items);pool=pool.concat(R.queue.splice(0,6-pool.length))}
  // avoid duplicate values in one round
  const seen=new Set();pool=pool.filter(p=>!seen.has(p[1].trim())&&seen.add(p[1].trim()));
  R.drawn=false;R.pairs=pool;R.left=shuffle(pool.map((p,i)=>i));R.right=shuffle(pool.map((p,i)=>i));R.matched=new Set();R.sel=null;
  drawMatch();
}
function drawMatch(){
  const grid=`<div>${R.left.map(i=>`<button class="mt l ${R.matched.has(i)?"done":""} ${R.sel===i?"sel":""}" ${R.matched.has(i)?"disabled":""} onclick="selL(${i})">${esc(R.pairs[i][0])}</button>`).join("")}</div>
  <div>${R.right.map(i=>`<button class="mt r ${R.matched.has(i)?"done":""}" id="mr${i}" ${R.matched.has(i)?"disabled":""} onclick="selR(${i})">${esc(R.pairs[i][1])}</button>`).join("")}</div>`;
  if(R.drawn&&$(".mgrid")){$(".mgrid").innerHTML=grid;const e=$("#errs");if(e)e.textContent=R.errors;return}
  R.drawn=true;
  $("#app").innerHTML=`<div class="hud"><button class="quit" onclick="quitAsk()">&#10005;</button><div class="prog"><i style="width:${100*R.round/R.rounds}%"></i></div><div class="hudr">${R.round+1}/${R.rounds}</div></div>
  <div class="chips"><span class="chip">${DECKS[R.deck].name.toUpperCase()}</span><span class="chip">&#9201; <b id="clock">0.0s</b></span><span class="chip">Misses <b id="errs">${R.errors}</b> (+5s each)</span></div>
  <p style="color:var(--mute);font-size:13px;margin-bottom:10px">Tap a contract, then tap its match.</p>
  <div class="mgrid"><div>${R.left.map(i=>`<button class="mt l ${R.matched.has(i)?"done":""} ${R.sel===i?"sel":""}" ${R.matched.has(i)?"disabled":""} onclick="selL(${i})">${esc(R.pairs[i][0])}</button>`).join("")}</div>
  <div>${R.right.map(i=>`<button class="mt r ${R.matched.has(i)?"done":""}" id="mr${i}" ${R.matched.has(i)?"disabled":""} onclick="selR(${i})">${esc(R.pairs[i][1])}</button>`).join("")}</div></div>`;
}
function selL(i){R.sel=i;drawMatch()}
function selR(j){
  if(R.sel==null){const e=$("#mr"+j);e&&e.animate([{transform:"translateX(-4px)"},{transform:"translateX(4px)"},{transform:"none"}],{duration:200});return}
  if(R.pairs[R.sel][1].trim()===R.pairs[j][1].trim()){R.matched.add(R.sel);if(R.sel!==j)R.matched.add(j);beep(true);R.sel=null;
    if([...R.pairs.keys()].every(k=>R.matched.has(k))){R.round++;if(R.round>=R.rounds)return finishMatch();setTimeout(matchRound,300);drawMatch();return}
    drawMatch();
  }else{R.errors++;R.missed[R.pairs[R.sel][0]]=R.pairs[R.sel][1];beep(false);buzz(false);const e=$("#mr"+j);if(e){e.classList.add("bad");setTimeout(()=>{R.sel=null;drawMatch()},450)}}
}
function finishMatch(){
  stopTimer();window.scrollTo(0,0);const t=+(((Date.now()-R.t0)/1000)+R.errors*5).toFixed(1);
  S.matchBest=S.matchBest||{};const prev=S.matchBest[R.deck],best=!prev||t<prev;if(best){S.matchBest[R.deck]=t;save()}
  const ms=Object.entries(R.missed);
  $("#app").innerHTML=`<div class="res-head"><div class="lbl">${DECKS[R.deck].name}</div><div class="big">${t}s</div>
  <div class="verdict ${best?"pos":""}" style="font-size:18px;margin-top:8px">${best?"New personal best":"Best: "+prev+"s"}</div><div class="lbl" style="margin-top:6px">${R.errors} miss${R.errors===1?"":"es"} (+5s each)</div></div>
  <div class="row"><button class="next ghost" onclick="home()">Floor</button><button class="next" onclick="startMatch('${R.deck}')">Again</button></div>
  ${ms.length?`<div class="sect">Learn these</div><div class="card"><table class="cs-t">${ms.map(([a,b])=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</table></div>`:""}`;
}
function matchIntro(){modal(`<div class="lbl">Memory game</div><h2>Contract Match</h2><p>3 rounds of 6 pairs. Every wrong match adds 5 seconds. Beat your best time.</p>
  <button class="next" onclick="closeModal();startMatch('sizes')">Contract sizes${S.matchBest&&S.matchBest.sizes?" \u00b7 best "+S.matchBest.sizes+"s":""}</button>
  <button class="next ghost" onclick="closeModal();startMatch('ticks')">Tick &amp; point values${S.matchBest&&S.matchBest.ticks?" \u00b7 best "+S.matchBest.ticks+"s":""}</button>
  <button class="next ghost" onclick="closeModal()">Back</button>`)}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(!R||$("#modal").classList.contains("show"))return;
  if(!R.items)return;const it=R.items[R.i];if(!it)return;
  if(R.answered==null){
    let i=-1;
    if(it.tf){if(/^[t1]$/i.test(e.key))i=0;if(/^[f2]$/i.test(e.key))i=1}
    else if(/^[1-4]$/.test(e.key))i=+e.key-1;
    else if(/^[a-d]$/i.test(e.key))i="abcd".indexOf(e.key.toLowerCase());
    if(i>=0&&i<it.opts.length)answer(i);
  }else if(e.key==="Enter"||e.key===" "){const n=$("#nextb");if(n){e.preventDefault();n.click()}}
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
home();
</script>
